      implDate: $('neImpl').value,
      evalEnd: $('neEvalEnd').value,
    };
    if (!exp.implDate) { alert('Implementation date is required.'); return; }
    if (!exp.title) exp.title = autoTitle(exp);
    (PAYLOAD.experiments ??= []).push(exp);
    await saveExperiments();
    renderExperiments();
    render(); // evaluation-period tables on the CTR tab depend on experiments
    renderTimelines();
  });
}

async function saveExperiments() {
  await fetch('/api/experiments', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(PAYLOAD.experiments),
  });
}

// ---- experiment timeline tab ------------------------------------------------
// One chart per pattern that has experiments: volume-weighted 7-day trial-intent
// CTR line, faint daily dots, experiment evaluation periods as bands with their
// dashed baseline level, and a separate session-volume mini-pane below.
let tlFilterId = ''; // '' = all patterns with experiments

function renderTimelines() {
  const wrap = $('tlCharts');
  const snap = PAYLOAD?.snapshot;
  if (!snap) { wrap.innerHTML = '<p class="tlIntro">No data snapshot yet.</p>'; return; }
  const dates = dateList(snap.startDate, snap.endDate);

  // filter dropdown: only patterns that actually have experiments
  const withExps = PAYLOAD.patterns.filter((p) => (PAYLOAD.experiments || []).some((x) => x.url === p.id && x.implDate));
  if (tlFilterId && !withExps.some((p) => p.id === tlFilterId)) tlFilterId = '';
  const sel = $('tlFilter');
  sel.innerHTML = '<option value="">(all patterns with experiments)</option>' +
    withExps.map((p) => `<option value="${p.id}"${p.id === tlFilterId ? ' selected' : ''}>${p.label}</option>`).join('');
  sel.onchange = () => { tlFilterId = sel.value; renderTimelines(); };
  let html = '<p class="tlIntro">Each chart: the <strong style="color:var(--accent)">blue line</strong> is the 7-day trial-intent CTR ' +
    '(free-trial + AI-agent clicks ÷ engaged sessions, volume-weighted); dots are single days. Shaded bands are experiment ' +
    'evaluation periods — the dashed line inside each band is that experiment\'s baseline, so line above dashed = better than before. ' +
    'Gray bars below show engaged-session volume. Hover days and bands for details. Patterns without experiments are not shown.</p>';
  let any = false;
  for (const p of withExps) {
    if (tlFilterId && p.id !== tlFilterId) continue;
    const exps = (PAYLOAD.experiments || []).filter((x) => x.url === p.id && x.implDate)
      .sort((a, b) => a.implDate.localeCompare(b.implDate));
    any = true;
    html += timelineChart(p, exps, dates);
  }
  wrap.innerHTML = any ? html : '<p class="tlIntro">No experiments yet — add one in the Web experiments tab.</p>';
  sizeTimelineLanes();
}

// absolute-positioned eval blocks don't size their lane container; heights can
// only be measured while the tab is visible, so this also runs on tab switch
function sizeTimelineLanes() {
  if ($('tlView').hidden) return;
  for (const lane of document.querySelectorAll('#tlCharts .tlEvalLane')) {
    lane.style.height = Math.max(0, ...[...lane.children].map((c) => c.offsetHeight)) + 'px';
  }
}
window.addEventListener('resize', sizeTimelineLanes);

function timelineChart(pattern, exps, dates, opts = {}) {
  const days = PAYLOAD.snapshot.data[pattern.id] || {};
  const metric = trendMetricOf(days);
  const evNames = metric.events;
  const organicAvg = dates.reduce((a, d) => a + (days[d]?.s.organic ?? 0), 0) / dates.length;
  const bucket = opts.bucket || (organicAvg >= MIN_ORGANIC_SESSIONS_PER_DAY ? 'organic' : 'paid');
  const bucketLabel = BUCKET_LABEL[bucket];
  const showEvals = opts.showEvals !== false;

  const n = dates.length;
  const sess = dates.map((d) => days[d]?.s[bucket] ?? 0);
  const evts = dates.map((d) => eventSum(days, [d], evNames, bucket));
  // started-trials line (CAI tab chart only): 7-day rolling sum on its own
  // right-hand scale, same traffic bucket as the CTR line ("–" era = no line)
  const tData = opts.showTrials ? PAYLOAD.snapshot.trials?.[pattern.id] : null;
  // trials: daily counts for the chosen bucket (null before tracking start)
  const tStart = PAYLOAD.snapshot.trialsStart || '';
  const tDaily = tData
    ? dates.map((d) => (tStart && d < tStart ? null : (tData[d]?.[bucket] ?? 0)))
    : null;
  const tRoll = tData
    ? dates.map((_, i) => { // trailing 7-day sum (trials per week)
        let sum = 0, seen = false;
        for (let j = Math.max(0, i - 6); j <= i; j++) {
          if (tDaily[j] !== null) { sum += tDaily[j]; seen = true; }
        }
        return seen ? sum : null;
      })
    : null;
  const daily = dates.map((_, i) => (sess[i] ? (evts[i] / sess[i]) * 100 : null));
  const roll = dates.map((_, i) => { // trailing 7-day volume-weighted CTR
    let s = 0, e = 0;
    for (let j = Math.max(0, i - 6); j <= i; j++) { s += sess[j]; e += evts[j]; }
    return s ? (e / s) * 100 : null;
  });

  // geometry (viewBox units); compact = flatter chart for the CAI tab
  const compact = !!opts.compact;
  // the full-width timeline charts render larger than the compact CAI chart,
  // so their in-SVG text takes smaller viewBox sizes
  const fsAxis = compact ? 9.5 : 8;
  const fsTitle = compact ? 10 : 8.5;
  // compact (CAI) charts: the plot spans the full viewBox width — axis labels
  // and the CTR/Trials titles are drawn INSIDE the plot, wherever they fit
  const W = 1000;
  const X0 = compact ? 0 : 46;
  const X1 = compact ? W : (tData ? 962 : 988); // full charts: trials axis needs right margin
  const CY0 = compact ? 22 : 20, CY1 = compact ? 106 : 186;   // CTR pane (compact leaves headroom for the axis titles)
  const VY0 = compact ? 112 : 206, VY1 = compact ? 158 : 256; // volume pane (full charts only)
  const VH = compact ? 140 : 272;                             // viewBox height (compact: bars live in the CTR pane, no mini-pane)
  const x = (i) => X0 + (i * (X1 - X0)) / Math.max(n - 1, 1);
  const rollMax = Math.max(...roll.filter((v) => v !== null), 1);
  const dom = Math.max(rollMax * 1.35, 5);
  const y = (v) => CY1 - (Math.min(v, dom) / dom) * (CY1 - CY0);
  const sessMax = Math.max(...sess, 1);
  // compact: bars share the CTR pane (own hidden scale, max ≈ pane height)
  const yv = (v) => compact
    ? CY1 - (v / sessMax) * (CY1 - CY0) * 0.96
    : VY1 - (v / sessMax) * (VY1 - VY0);
  const xi = new Map(dates.map((d, i) => [d, i]));

  let s = `<svg viewBox="0 0 ${W} ${VH}" xmlns="http://www.w3.org/2000/svg" font-family="inherit">`;

  // gridlines + y labels (recessive)
  const ticks = 4;
  for (let t = 0; t <= ticks; t++) {
    const v = (dom / ticks) * t, gy = y(v);
    s += `<line x1="${X0}" y1="${gy}" x2="${X1}" y2="${gy}" stroke="#d9d6d2" stroke-width="1"/>` +
      (compact
        ? `<text x="2" y="${gy - 2}" font-size="${fsAxis}" fill="#777577">${v.toFixed(v < 10 ? 1 : 0)}%</text>`
        : `<text x="${X0 - 6}" y="${gy + 3}" text-anchor="end" font-size="${fsAxis}" fill="#777577">${v.toFixed(v < 10 ? 1 : 0)}%</text>`);
  }
  // axis title in line color above the plot, with clear space above the top axis value
  if (compact) s += `<text x="2" y="${CY0 - 14}" font-size="9.5" font-weight="600" fill="#002660">CTR</text>`;
  // month ticks
  dates.forEach((d, i) => {
    if (d.slice(8) === '01' || i === 0) {
      s += `<text x="${x(i)}" y="${CY1 + 12}" font-size="${fsAxis}" fill="#777577">${d.slice(5, 7)}/${d.slice(0, 4)}</text>` +
        `<line x1="${x(i)}" y1="${CY1}" x2="${x(i)}" y2="${CY1 + 3}" stroke="#b5b9bc"/>`;
    }
  });

  // experiment bands + baselines (annotation layer under the data marks)
  const lanes = [];
  const evalBlocks = [];
  const bandTitles = [];
  for (const ex of (opts.showBands === false ? [] : exps)) {
    const bs = evalStart(ex.implDate);
    const be = ex.evalEnd || PAYLOAD.snapshot.endDate;
    const i0 = xi.get(bs < dates[0] ? dates[0] : bs), i1 = xi.get(be > dates[n - 1] ? dates[n - 1] : be);
    if (i0 === undefined || i1 === undefined || i1 < i0) continue;
    let lane = lanes.findIndex((endI) => endI < i0);
    if (lane === -1) { lanes.push(i1); lane = lanes.length - 1; } else { lanes[lane] = i1; }
    const bx0 = x(i0), bx1 = x(i1);
    const bandDates = dates.slice(i0, i1 + 1);
    const pCtr = periodCtr(days, bandDates, bucket, evNames);
    const base = baselineCtr(ex, days, bucket, bs, bandDates.length, evNames);
    const delta = base.ctr && pCtr !== null ? ` (${pCtr >= base.ctr ? '+' : ''}${(((pCtr - base.ctr) / base.ctr) * 100).toFixed(0)}%)` : '';
    const tip = `${ex.title}\n${bs} → ${be}${ex.evalEnd ? '' : ' (running)'}\nBaseline (${base.label}): ${base.ctr === null ? 'n/a' : base.ctr.toFixed(1) + '%'}` +
      `\nPeriod: ${pCtr === null ? 'n/a' : pCtr.toFixed(1) + '%'}${delta}`;
    // short evaluation block shown under the chart, sized/positioned like the
    // experiment's band (full AI evaluation on hover); dates without the year
    if (showEvals) {
      const firstSentences = (ex.evaluation || '').split(/(?<=\.)\s+/).slice(0, 2).join(' ');
      const shortEval = firstSentences.length > 220 ? firstSentences.slice(0, 217) + '…' : firstSentences;
      let leftPct = bx0 / 10, widthPct = (bx1 - bx0) / 10;
      if (widthPct < 13) widthPct = 13; // keep narrow bands readable
      if (leftPct + widthPct > 98.8) leftPct = 98.8 - widthPct;
      evalBlocks.push({
        lane,
        html: `<div class="tlEvalBlock" style="left:${leftPct.toFixed(2)}%;width:${widthPct.toFixed(2)}%" title="${esc(ex.evaluation || '')}">` +
          `<strong>${esc(ex.title)}</strong> <span class="meta">${fmtShort(bs)}–${fmtShort(be)}${ex.evalEnd ? '' : ' (running)'} · ` +
          `${base.ctr === null ? 'n/a' : base.ctr.toFixed(1) + '%'} → ${pCtr === null ? 'n/a' : pCtr.toFixed(1) + '%'}${delta}</span>` +
          `<br><span class="evalTxt">${shortEval ? esc(shortEval) : '(no AI evaluation yet)'}</span></div>`,
      });
    }
    s += `<g><title>${esc(tip)}</title>` +
      `<rect x="${bx0}" y="${CY0}" width="${Math.max(bx1 - bx0, 2)}" height="${CY1 - CY0}" fill="rgba(255,229,0,.16)"/>` +
      `<line x1="${bx0}" y1="${CY0}" x2="${bx0}" y2="${CY1}" stroke="#ccb700" stroke-width="1"/>` +
      `<line x1="${bx1}" y1="${CY0}" x2="${bx1}" y2="${CY1}" stroke="#ccb700" stroke-width="1" stroke-dasharray="2 2"/>` +
      (base.ctr !== null && base.ctr <= dom
        ? `<line x1="${bx0}" y1="${y(base.ctr)}" x2="${bx1}" y2="${y(base.ctr)}" stroke="#5e5d60" stroke-width="1.4" stroke-dasharray="5 4"/>` : '') + '</g>';
    // title texts are emitted LAST (after the per-day hover rects) so real
    // mouse clicks reach them — anything drawn earlier sits below the
    // transparent hover layer in SVG hit-testing
    bandTitles.push(`<g><title>Open “${esc(ex.title)}” on the Experimentation Log tab</title>` +
      (bx0 + 4 + ex.title.length * 5.6 > X1
        ? `<text x="${X1 - 4}" y="${CY0 + 11 + lane * 13}" text-anchor="end" font-size="${fsTitle}" font-weight="600" fill="#5e5d60" class="expLink" data-exp="${(PAYLOAD.experiments || []).indexOf(ex)}">${esc(ex.title)}</text>`
        : `<text x="${bx0 + 4}" y="${CY0 + 11 + lane * 13}" font-size="${fsTitle}" font-weight="600" fill="#5e5d60" class="expLink" data-exp="${(PAYLOAD.experiments || []).indexOf(ex)}">${esc(ex.title)}</text>`) + '</g>');
  }

  // volume bars — in-pane behind the lines (compact) or in the mini-pane below (full charts)
  const bw = Math.max(((X1 - X0) / n) * (compact ? 0.85 : 0.7), 0.8);
  const barBottom = compact ? CY1 : VY1;
  dates.forEach((d, i) => {
    if (sess[i]) s += `<rect x="${x(i) - bw / 2}" y="${yv(sess[i])}" width="${bw}" height="${barBottom - yv(sess[i])}" fill="#d3d6d8"${compact ? ' opacity=".55"' : ''}/>`;
  });
  if (!compact) {
    s += `<line x1="${X0}" y1="${VY1}" x2="${X1}" y2="${VY1}" stroke="#b5b9bc"/>` +
      `<text x="${X0 - 6}" y="${VY0 + 4}" text-anchor="end" font-size="${fsAxis}" fill="#777577">${fmtInt(sessMax)}</text>` +
      `<text x="${X1}" y="${VY1 + 12}" text-anchor="end" font-size="${fsAxis}" fill="#777577">engaged sessions/day (${bucketLabel.toLowerCase()})</text>`;
  }

  // daily dots (faint; timeline charts only) + 7-day line
  if (!compact) {
    dates.forEach((d, i) => {
      if (daily[i] !== null) s += `<circle cx="${x(i)}" cy="${y(daily[i])}" r="1.7" fill="#002660" opacity=".3"/>`;
    });
  }
  let path = '', pen = false;
  roll.forEach((v, i) => {
    if (v === null) { pen = false; return; }
    path += `${pen ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`;
    pen = true;
  });
  s += `<path d="${path}" fill="none" stroke="#002660" stroke-width="2" stroke-linejoin="round"/>`;

  // started-trials line: 7-day rolling sum, gold, right-hand scale
  if (tRoll && tRoll.some((v) => v !== null)) {
    const tMax = Math.max(...tRoll.filter((v) => v !== null), 1);
    const tDom = Math.max(Math.ceil(tMax * 1.35), 5);
    const yt = (v) => CY1 - (Math.min(v, tDom) / tDom) * (CY1 - CY0);
    for (let t = 0; t <= 4; t++) { // right axis labels on the shared gridlines
      const v = Math.round((tDom / 4) * t);
      s += compact
        ? `<text x="${W - 2}" y="${yt(v) - 2}" text-anchor="end" font-size="${fsAxis}" fill="#a89700">${fmtInt(v)}</text>`
        : `<text x="${X1 + 5}" y="${yt(v) + 3}" font-size="${fsAxis}" fill="#a89700">${fmtInt(v)}</text>`;
    }
    let tPath = '', tPen = false;
    tRoll.forEach((v, i) => {
      if (v === null) { tPen = false; return; }
      tPath += `${tPen ? 'L' : 'M'}${x(i).toFixed(1)} ${yt(v).toFixed(1)}`;
      tPen = true;
    });
    s += `<path d="${tPath}" fill="none" stroke="#ccb700" stroke-width="2" stroke-linejoin="round"/>`;
    // axis title in line color above the plot, with clear space above the top axis value
    if (compact) s += `<text x="${W - 2}" y="${CY0 - 14}" text-anchor="end" font-size="9.5" font-weight="600" fill="#a89700">Trials</text>`;
  }

  // per-day hover targets (native tooltips)
  const colW = (X1 - X0) / Math.max(n - 1, 1);
  dates.forEach((d, i) => {
    const t = `${d}\nCTR: ${daily[i] === null ? '–' : daily[i].toFixed(1) + '%'} · 7-day: ${roll[i] === null ? '–' : roll[i].toFixed(1) + '%'}\n${fmtInt(sess[i])} engaged sessions (${bucketLabel.toLowerCase()})` +
      (tRoll ? `\nTrials: ${tDaily[i] === null ? '– (not yet tracked)' : fmtInt(tDaily[i])} · 7-day sum: ${tRoll[i] === null ? '–' : fmtInt(tRoll[i])}` : '');
    s += `<rect x="${x(i) - colW / 2}" y="${CY0}" width="${colW}" height="${(compact ? CY1 + 14 : VY1) - CY0}" fill="transparent"><title>${esc(t)}</title></rect>`;
  });
  s += bandTitles.join('');

  s += '</svg>';
  // one positioned row ("lane") per set of non-overlapping experiments,
  // mirroring the band lanes in the chart above
  const maxLane = Math.max(-1, ...evalBlocks.map((b) => b.lane));
  let evalsHtml = '';
  for (let l = 0; l <= maxLane; l++) {
    evalsHtml += `<div class="tlEvalLane">${evalBlocks.filter((b) => b.lane === l).map((b) => b.html).join('')}</div>`;
  }
  const heading = pattern.example
    ? `<a class="patLink" href="${pattern.example}" target="_blank" title="Open an example page: ${pattern.example}">${esc(pattern.label)} ↗</a>`
    : esc(pattern.label);
  return `<div class="tlChart"><h3>${heading}</h3>` +
    `<span class="meta">${metric.fallback ? 'Button-click CTR (no trial-intent tracking on these pages — based on all_button_clicks)' : 'Trial-intent CTR'} · ${bucketLabel} traffic · 7-day volume-weighted line${compact ? ' · gray bars = engaged sessions/day (own scale — hover for values)' : ', single-day dots'}` +
    (tRoll ? ` · <span style="color:#a89700;font-weight:600">gold</span> = started trials (Entry Attribution, ${bucketLabel.toLowerCase()}${bucket === 'all' ? '' : ' per Salesforce Source Category'}), 7-day sum on the right scale` : '') +
    `</span>${s}${evalsHtml}</div>`;
}

let currentPatternId = 'home'; // CAI tab default: homepage
let ctrBucket = 'all'; // traffic type for the CAI tab's development chart

// In the standalone artifact, API calls go to the local dashboard server.
const API = window.__EMBEDDED__ ? 'http://localhost:3010' : '';

// group the pattern list for dropdowns; the cross-section aggregates go into
// their own section at the bottom
const AGGREGATE_IDS = new Set(['connect-ai-all', 'ai-all']);
// hand-picked page sets (experiment cohorts) vs. the generic URL patterns
const PAGE_SET_IDS = new Set(['ai-connect-sap-datasource', 'ai-connect-sf-to-claude',
  'ai-connect-top15-to-claude', 'ai-connect-top16-to-claude', 'ai-connect-top25-to-claude']);
const GROUP_ORDER = ['General', '/ai/ URL patterns', 'Selected page sets', '/drivers/ pages', 'Misc pages', 'Aggregates'];
const patternGroup = (p) =>
  AGGREGATE_IDS.has(p.id) ? 'Aggregates' :
  PAGE_SET_IDS.has(p.id) ? 'Selected page sets' :
  p.id === 'ai-lp-campaign' ? 'Misc pages' :
  p.id === 'ai' || p.id.startsWith('ai-') ? '/ai/ URL patterns' :
  p.id.startsWith('drivers') ? '/drivers/ pages' :
  p.id === 'home' ? 'General' : 'Misc pages';

function patternOptionsHtml() {
  const groups = new Map();
  for (const p of PAYLOAD.patterns) {
    const g = patternGroup(p);
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(p);
  }
  // powerbi leads the /drivers/ section
  groups.get('/drivers/ pages')?.sort((a, b) =>
    (b.id === 'drivers-ds-powerbi') - (a.id === 'drivers-ds-powerbi'));
  const entries = [...groups.entries()].sort((a, b) =>
    GROUP_ORDER.indexOf(a[0]) - GROUP_ORDER.indexOf(b[0]));
  return entries.map(([g, ps]) =>
    `<optgroup label="${g}">` + ps.map((p) => `<option value="${p.id}">${optionLabel(p)}</option>`).join('') + '</optgroup>'
  ).join('');
}

// native <option>s ignore markup, so the [placeholder] parts are italicized via
// the Unicode math-italic alphabet (digits have no italic form and stay as-is)
const italChar = (c) =>
  c === 'h' ? 'ℎ' :
  c >= 'a' && c <= 'z' ? String.fromCodePoint(0x1D44E + c.charCodeAt(0) - 97) :
  c >= 'A' && c <= 'Z' ? String.fromCodePoint(0x1D434 + c.charCodeAt(0) - 65) : c;
const optionLabel = (p) => p.label
  .replace(' (main page)', '')
  .replace(/\[([^\]]+)\]/g, (_, s) => '[' + [...s].map(italChar).join('') + ']');

// ---- Funnel View tab ---------------------------------------------------------
// The six funnel categories with their URL patterns, live 28-day numbers from
// the snapshot, and the paid-search-intent summaries from funnel-intents.json
// (written by the visitor-intent analysis).
const FUNNEL_TINTS = { gateway: '#fffdfa', hub: '#fffacc', entity: '#dbe4f0', pair: '#f1eee9', bridge: '#edeeef', knowledge: '#fffdfa' };
function renderFunnel() {
  const fi = PAYLOAD.funnelIntents;
  if (!fi) { $('funnelIntro').innerHTML = '<p class="tlIntro">No funnel-intent data (funnel-intents.json missing).</p>'; return; }
  // numbers are frozen to the analysis window — the whole tab updates only on
  // request (a new visitor-intent run rewrites funnel-intents.json)
  const end = fi.statsTo || PAYLOAD.snapshot.endDate;
  const from = fi.statsFrom || (() => {
    const d0 = new Date(end + 'T00:00:00Z'); d0.setUTCDate(d0.getUTCDate() - 27);
    return d0.toISOString().slice(0, 10);
  })();
  const stats = (cat) => {
    let all = 0, paid = 0, org = 0, tr = 0;
    for (const pid of cat.patterns) {
      for (const [ds, v] of Object.entries(PAYLOAD.snapshot.data[pid] || {})) {
        if (ds < from || ds > end) continue;
        all += (v.s?.all) || 0; paid += (v.s?.paid) || 0; org += (v.s?.organic) || 0;
      }
      const t = PAYLOAD.snapshot.trials?.[pid] || {};
      for (const [ds, v] of Object.entries(t)) { if (ds >= from && ds <= end) tr += v.all || 0; }
    }
    return { all, paid, org, tr };
  };
  const patLabel = (pid) => ((PAYLOAD.patterns.find((p) => p.id === pid) || { label: pid }).label).replace(' (main page)', '');
  // experiment names mentioned in the intent texts link to their Experimentation Log row
  const linkExp = (html) => html.replace(/the (How-it-works) experiment/g, (m, t) => {
    const idx = (PAYLOAD.experiments || []).findIndex((x) => x.title === t);
    return idx < 0 ? m : `the <span class="expLink" data-exp="${idx}" title="Open on the Experimentation Log tab">${t}</span> experiment`;
  });
  const stageHtml = (cat, width) => {
    const s = stats(cat);
    const chips = cat.patterns.map((pid) => `<span class="funnelChip" data-pattern="${pid}" title="Open on the CAI Traffic, CTR & Trials tab">${esc(patLabel(pid))}</span>`).join('');
    const perPattern = cat.patternIntents
      ? Object.entries(cat.patternIntents).map(([pid, txt]) =>
          `<p class="fpat"><code>${esc(patLabel(pid))}</code> — ${esc(txt)}</p>`).join('')
      : '';
    return `<div class="funnelStage" style="${width ? `width:${width}%;` : ''}background:${FUNNEL_TINTS[cat.id] || 'var(--label-bg)'}">` +
      `<h3>${esc(cat.name)}</h3><div class="frole">${esc(cat.role)}</div>` +
      `<div>${chips}</div>` +
      `<details><summary>Numbers, search intent & CTA intention</summary>` +
      `<div class="fnums">${fmtInt(s.all)} engaged sessions · ${fmtInt(s.tr)} started trials</div>` +
      `<p><strong>Paid search intent (${fmtInt(s.paid)} paid engaged sessions):</strong> ${linkExp(esc(cat.intent))}</p>` + perPattern +
      (cat.organicIntent ? `<p><strong>Organic search intent (${fmtInt(s.org)} organic engaged sessions):</strong> ${linkExp(esc(cat.organicIntent))}</p>` : '') +
      `<p class="fcta"><strong>CTA intention:</strong> ${esc(cat.cta)}</p></details></div>`;
  };
  $('funnelIntro').innerHTML =
    `<p class="tlIntro">The Connect AI page types by their role on the path to a trial: the spine orders them from broad entry to specific answer ` +
    `(block width = breadth of intent), bridge, campaign-lander, platform-proof and knowledge pages feed in from the side. Visitors enter at any block and can start a trial from ` +
    `anywhere — the order shows depth of intent, not a sequence pages must be walked through. Numbers cover the analysis window ` +
    `(${fmtShort(from)}–${fmtShort(end)}${end.slice(2, 4)}); trials counted since tracking began. Click a URL pattern to open it on the CAI tab.</p>` +
    (fi.method ? `<p class="tlIntro"><strong>How the intent readings are made</strong> (${esc(fi.window)}): ` +
      esc(fi.method).replace('based on the actual Google Ads search terms', '<strong>based on the actual Google Ads search terms</strong>')
        .replace("Google Search Console's", "<strong>Google Search Console</strong>'s") + '</p>' : '');
  const byId = Object.fromEntries(fi.categories.map((c) => [c.id, c]));
  const spineOrder = [['gateway', 100], ['hub', 86], ['entity', 72], ['pair', 58]];
  $('funnelSpine').innerHTML = spineOrder
    .map(([id, w], i) => (byId[id] ? (i ? '<div class="funnelArrow">▼</div>' : '') + stageHtml(byId[id], w) : ''))
    .join('');
  $('funnelSide').innerHTML = ['bridge', 'landers', 'proof', 'knowledge'].map((id) => byId[id] ? stageHtml(byId[id], 0) : '').join('');
}

// Weekly view of ALL started trials (Entry Attribution) by entry category:
// website entries split into the traffic buckets via the Salesforce Source

// bar colors = the shades the CAI tab's tables already use: Resolve blue and
// its row tints for the web-traffic buckets, the gold/Agility family for the
// app entries, Balance/Clarity grays for the rest
const ATTR_CATS = [
  ['paid', 'Paid traffic', '#002660'],
  ['organic', 'Organic traffic', '#dbe4f0'],
  ['direct', 'Direct traffic', '#b5b9bc'],
  ['web-other', 'Other web sources (Referral, AI Referral, Events, unclassified)', '#f1eee9'],
  ['app-mcp', 'Claude App', '#ccb700'],
  ['app-gpt', 'ChatGPT App', '#ffe500'],
  ['https://capture.navattic.com/', 'Product Tour', '#777577'],
];
const TRAFFIC_CATS = new Set(['paid', 'organic', 'direct', 'web-other']);
// category -> GA4 session bucket of the all-Connect-AI aggregate, for the
// per-source CVR columns. App categories have no web session; "web-other" has
// none either — its trials are mostly SFDC-unclassified and do NOT correspond
// to GA4's small "other" session bucket, so a ratio there would mislead.
const CAT_SESS_BUCKET = { paid: 'paid', organic: 'organic', direct: 'direct' };

function renderAttribution() {
  const attr = PAYLOAD.snapshot.trialAttribution || {};
  const start = PAYLOAD.snapshot.trialsStart, end = PAYLOAD.snapshot.endDate;
  if (!start || !Object.keys(attr).length) {
    $('attrIntro').innerHTML = '<p class="tlIntro">No trial attribution data yet.</p>';
    return;
  }
  // Mon–Sun ISO weeks from the tracking start through the newest lead date
  // (leads can be newer than the GA4 endDate — the trials fetch runs live)
  const lastDate = Object.keys(attr).sort().pop();
  const weeks = [];
  const d0 = new Date(start + 'T00:00:00Z');
  d0.setUTCDate(d0.getUTCDate() - ((d0.getUTCDay() + 6) % 7)); // back to Monday
  for (let m = d0; ; m.setUTCDate(m.getUTCDate() + 7)) {
    const from = m.toISOString().slice(0, 10);
    if (from > lastDate) break;
    const t = new Date(m); t.setUTCDate(t.getUTCDate() + 6);
    const to = t.toISOString().slice(0, 10);
    const dates = [];
    for (let dd = new Date(m); dd <= t; dd.setUTCDate(dd.getUTCDate() + 1)) {
      const ds = dd.toISOString().slice(0, 10);
      if (ds >= start) dates.push(ds);
    }
    // partial at either end: cut off by the tracking start (e.g. CW 36 starts
    // 31.08 but tracking begins 01.09) or still running past the newest lead
    weeks.push({ from, to, dates, partial: to > lastDate || from < start });
  }
  // per-week sums per category + engaged sessions (all Connect AI pages, All)
  const allDays = PAYLOAD.snapshot.data['connect-ai-all'] || {};
  const catIds = [...ATTR_CATS.map(([id]) => id)];
  for (const day of Object.values(attr)) // discover categories beyond the known set
    for (const c of Object.keys(day)) if (!catIds.includes(c)) catIds.push(c);
  const catMeta = (id) => ATTR_CATS.find(([cid]) => cid === id) || [id, id, '#777577'];
  // brightness-ranked shades (all from the CAI tables' palette): the LARGEST
  // source gets the brightest shade, the smallest the darkest
  const SHADES = ['#f1eee9', '#dbe4f0', '#ffe500', '#b5b9bc', '#ccb700', '#002660', '#777577', '#15151c'];
  const oppsBy = PAYLOAD.snapshot.trialOpps || {};
  const maxExp = PAYLOAD.snapshot.trialMaxExpiry || {};
  const today = new Date().toISOString().slice(0, 10);
  for (const w of weeks) {
    w.cats = {}; w.sess = 0;
    w.sessB = { paid: 0, organic: 0, direct: 0, other: 0 };
    w.opps = {}; w.oppsTotal = 0;
    // "(incomplete)" while any of the week's trials has not expired yet — more
    // opportunities can still appear for these signups
    w.oppsIncomplete = w.dates.some((ds) => (maxExp[ds] || '') >= today);
    for (const ds of w.dates) {
      for (const [c, n] of Object.entries(attr[ds] || {})) w.cats[c] = (w.cats[c] || 0) + n;
      for (const [c, n] of Object.entries(oppsBy[ds] || {})) { w.opps[c] = (w.opps[c] || 0) + n; w.oppsTotal += n; }
      const s = allDays[ds]?.s || {};
      w.sess += s.all || 0;
      w.sessB.paid += s.paid || 0;
      w.sessB.organic += s.organic || 0;
      w.sessB.direct += s.direct || 0;
      w.sessB.other += Math.max((s.all || 0) - (s.paid || 0) - (s.organic || 0) - (s.direct || 0), 0);
    }
    w.traffic = catIds.filter((c) => TRAFFIC_CATS.has(c)).reduce((a, c) => a + (w.cats[c] || 0), 0);
    w.total = catIds.reduce((a, c) => a + (w.cats[c] || 0), 0);
    w.cvr = w.sess ? (w.traffic / w.sess) * 100 : null;
  }
  const totBy = {};
  for (const w of weeks) for (const [c, v] of Object.entries(w.cats)) totBy[c] = (totBy[c] || 0) + v;
  const colorOf = {};
  catIds.filter((c) => totBy[c]).sort((a, b) => totBy[b] - totBy[a])
    .forEach((c, i) => { colorOf[c] = SHADES[Math.min(i, SHADES.length - 1)]; });
  const catColor = (id) => colorOf[id] || '#777577';
  const fmtDM = (d) => `${d.slice(8)}.${d.slice(5, 7)}.`;
  const wkLabel = (w) => `CW ${isoWeekNo(w.from)} · ${fmtDM(w.from)}–${fmtDM(w.to)}${w.partial ? ' (partial)' : ''}`;

  $('attrIntro').innerHTML = '<p class="tlIntro">All started Connect AI trials (Salesforce Entry Attribution, tracked since ' +
    start + '), weekly by entry category: website entries — pages and the page-less <code>web</code> marker — are split into ' +
    'the traffic types via the Salesforce Source Category; <code>app-mcp</code>/<code>app-gpt</code> signups start inside the ' +
    'AI apps and carry no web session. CVR = traffic-related trials ÷ page-level engaged sessions on all Connect AI pages ' +
    '(all traffic) — sessions of the last two days are still settling in GA4, so the newest week reads high.</p>';

  // ---- chart: stacked weekly bars + CVR line. The viewBox width follows the
  // week count with a tight slot per bar, so few weeks render as a large chart
  // with closely spaced bars instead of a sparse full-width one.
  const n = weeks.length;
  const SLOT = 120, PX0 = 30;
  const PX1 = PX0 + n * SLOT, W = PX1 + 42, H = 250, PY0 = 26, PY1 = 195;
  const xc = (i) => PX0 + (i + 0.5) * SLOT;
  const bw = SLOT * 0.66;
  const maxTot = Math.max(...weeks.map((w) => w.total), 1) * 1.12;
  const yb = (v) => PY1 - (v / maxTot) * (PY1 - PY0);
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="inherit" style="max-width:${Math.round(W * 1.35)}px">`;
  for (let t = 0; t <= 4; t++) {
    const v = Math.round((maxTot / 4) * t), gy = yb(v);
    svg += `<line x1="${PX0}" y1="${gy}" x2="${PX1}" y2="${gy}" stroke="#d9d6d2"/>` +
      `<text x="${PX0 - 5}" y="${gy + 3}" text-anchor="end" font-size="9" fill="#777577">${fmtInt(v)}</text>`;
  }
  weeks.forEach((w, i) => {
    let yTop = PY1;
    const parts = catIds.filter((c) => w.cats[c]);
    const tipLines = parts.map((c) => `${catMeta(c)[1]}: ${fmtInt(w.cats[c])}`).join('\n');
    const tip = `${wkLabel(w)}\n${tipLines}\nWebsite entries: ${fmtInt(w.traffic)} · All: ${fmtInt(w.total)}` +
      `\nEngaged sessions (all CAI pages): ${fmtInt(w.sess)}\nCVR: ${w.cvr === null ? '–' : w.cvr.toFixed(2) + '%'}`;
    svg += '<g>';
    for (const c of parts) {
      const h = (w.cats[c] / maxTot) * (PY1 - PY0);
      yTop -= h;
      svg += `<rect x="${xc(i) - bw / 2}" y="${yTop}" width="${bw}" height="${h}" fill="${catColor(c)}" stroke="#b5b9bc" stroke-width="0.5"/>`;
    }
    svg += `<text x="${xc(i)}" y="${yTop - 4}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#15151c">${fmtInt(w.total)}</text>` +
      `<text x="${xc(i)}" y="${PY1 + 13}" text-anchor="middle" font-size="9.5" fill="#5e5d60">CW ${isoWeekNo(w.from)}${w.partial ? ' (partial)' : ''}</text>` +
      `<text x="${xc(i)}" y="${PY1 + 25}" text-anchor="middle" font-size="8.5" fill="#777577">${fmtDM(w.from)}–${fmtDM(w.to)}</text>` +
      `<rect x="${xc(i) - bw / 2 - 6}" y="${PY0}" width="${bw + 12}" height="${PY1 - PY0}" fill="transparent"><title>${esc(tip)}</title></rect></g>`;
  });
  // CVR line for the traffic-related trials (own hidden scale)
  const cvrMax = Math.max(...weeks.map((w) => w.cvr || 0), 0.1) * 1.35;
  const yc = (v) => PY1 - (v / cvrMax) * (PY1 - PY0);
  let lp = '', pen = false;
  weeks.forEach((w, i) => {
    if (w.cvr === null) { pen = false; return; }
    lp += `${pen ? 'L' : 'M'}${xc(i)} ${yc(w.cvr).toFixed(1)}`; pen = true;
  });
  svg += `<path d="${lp}" fill="none" stroke="#15151c" stroke-width="1.8" stroke-dasharray="6 4"/>`;
  weeks.forEach((w, i) => {
    if (w.cvr === null) return;
    svg += `<circle cx="${xc(i)}" cy="${yc(w.cvr)}" r="2.6" fill="#15151c"/>` +
      `<text x="${xc(i) + 8}" y="${yc(w.cvr) - 6}" font-size="9.5" font-weight="600" fill="#15151c">${w.cvr.toFixed(2)}%</text>`;
  });
  svg += `<line x1="${PX0}" y1="${PY1}" x2="${PX1}" y2="${PY1}" stroke="#b5b9bc"/></svg>`;
  const legend = catIds.filter((c) => weeks.some((w) => w.cats[c]))
    .map((c) => `<span style="margin-right:14px;white-space:nowrap"><span style="display:inline-block;width:9px;height:9px;background:${catColor(c)};border:1px solid #b5b9bc;margin-right:4px"></span>${esc(catMeta(c)[1])}</span>`)
    .join('') +
    `<span style="white-space:nowrap"><span style="display:inline-block;width:14px;border-top:2px dashed #15151c;margin:0 4px 3px 0"></span>CVR (website-entry trials ÷ engaged sessions)</span>`;
  $('attrChart').innerHTML = svg + `<div class="meta" style="margin:2px 20px 14px">${legend}</div>`;

  // ---- weekly table: three columns per week — share of the week's trials,
  // absolute trials, and CVR against the matching session bucket where one exists
  const shareStr = (v, total) => {
    if (!total) return '–';
    const sh = (v / total) * 100;
    return sh.toFixed(sh > 0 && sh < 9.95 ? 1 : 0) + '%';
  };
  const cvrStr1 = (trials, sessions) => (sessions ? ((trials / sessions) * 100).toFixed(1) + '%' : '–');
  const cols = weeks.map((w) => `<th colspan="4">CW ${isoWeekNo(w.from)}${w.partial ? ' (partial)' : ''}<br><small style="font-weight:400">${fmtDM(w.from)}–${fmtDM(w.to)}</small></th>`).join('');
  const subCols = weeks.map((w) => `<th class="attrSub">Share</th><th class="attrSub">Trials</th><th class="attrSub">CVR</th><th class="attrSub" title="Connect AI new-business opportunities opened on the signup's account on/after the trial start${w.oppsIncomplete ? ' — some of this week’s trials are still running, more opportunities can follow' : ''}">Opps${w.oppsIncomplete ? '<br><span style="font-size:8px">(incomplete)</span>' : ''}</th>`).join('');
  let rows = '';
  for (const c of catIds) {
    if (!weeks.some((w) => w.cats[c])) continue;
    const [, label] = catMeta(c);
    const sb = CAT_SESS_BUCKET[c];
    rows += `<tr class="evt"><th><span style="display:inline-block;width:8px;height:8px;background:${catColor(c)};border:1px solid #b5b9bc;margin-right:5px"></span>${esc(label)}</th>` +
      weeks.map((w) => {
        const v = w.cats[c] || 0;
        return `<td class="attrShare">${shareStr(v, w.total)}</td><td><small style="color:var(--muted)">${fmtInt(v)}</small></td>` +
          `<td><small>${sb ? cvrStr1(v, w.sessB[sb]) : '–'}</small></td><td><small>${fmtInt(w.opps[c] || 0)}</small></td>`;
      }).join('') + '</tr>';
  }
  // total row: all self-service trials with an entry attribution — "traffic-related"
  // as opposed to the sales-led motion's trials. Its CVR uses the website-entry
  // trials only (app entries carry no web session).
  rows += `<tr class="trials"><th>Traffic-related trials</th>${weeks.map((w) =>
      `<td class="attrShare">100%</td><td><small style="color:var(--muted)">${fmtInt(w.total)}</small></td><td><small>${w.cvr === null ? '–' : w.cvr.toFixed(1) + '%'}</small></td><td><small>${fmtInt(w.oppsTotal)}</small></td>`).join('')}</tr>`;
  $('attrWrap').innerHTML = `<table><thead><tr><th rowspan="2">Entry attribution</th>${cols}</tr><tr>${subCols}</tr></thead><tbody>${rows}</tbody></table>` +
    '<p class="tlIntro" style="margin-top:6px">Traffic-related trials = all self-service trials with an entry attribution (as opposed to sales-created trials). Per-source CVR = the source\'s trials ÷ the matching GA4 session bucket on all Connect AI pages (paid/organic/direct only); the total row\'s CVR uses the website-entry trials ÷ all engaged sessions. Trial source from Salesforce, sessions from GA4 — independent systems, so per-source CVRs are approximations. No CVR for app entries (no web session) or "other web" (largely unclassified Salesforce sources with no matching session bucket). Opps = Connect AI new-business opportunities opened on the signup\'s converted account on/after the trial start — sales opens opportunities manually, so they lag the trial; a week is "(incomplete)" while any of its trials has not expired yet.</p>';

  // ---- second table: the same weekly view per URL pattern (entry page →
  // dashboard pattern). Selected page sets, the /drivers/ MCP and Cloud pages
  // and the aggregates are excluded; the remaining patterns are URL-disjoint,
  // so each trial counts in exactly one row.
  const PAT_EXCL = new Set(['drivers-ds-mcp', 'drivers-ds-cloud']);
  const pats = PAYLOAD.patterns.filter((p) => !AGGREGATE_IDS.has(p.id) && !PAGE_SET_IDS.has(p.id) && !PAT_EXCL.has(p.id));
  const pTrials = (pid, dates) => dates.reduce((a, d) => a + (PAYLOAD.snapshot.trials?.[pid]?.[d]?.all ?? 0), 0);
  const pSess = (pid, dates) => dates.reduce((a, d) => a + (PAYLOAD.snapshot.data[pid]?.[d]?.s.all ?? 0), 0);
  const wk2 = weeks.map((w) => {
    const per = {};
    let tot = 0;
    for (const p of pats) { const v = pTrials(p.id, w.dates); per[p.id] = v; tot += v; }
    return { ...w, per, tot };
  });
  const patTotal = (pid) => wk2.reduce((a, w) => a + w.per[pid], 0);
  const rows2 = [...pats].sort((a, b) => patTotal(b.id) - patTotal(a.id))
    .map((p) => `<tr class="evt"><th>${optionLabel(p)}</th>` + wk2.map((w) => {
      const v = w.per[p.id];
      return `<td class="attrShare">${shareStr(v, w.tot)}</td><td><small style="color:var(--muted)">${fmtInt(v)}</small></td>` +
        `<td><small>${cvrStr1(v, pSess(p.id, w.dates))}</small></td>`;
    }).join('') + '</tr>').join('');
  const totRow2 = `<tr class="trials"><th>All listed patterns</th>` + wk2.map((w) =>
    `<td class="attrShare">100%</td><td><small style="color:var(--muted)">${fmtInt(w.tot)}</small></td>` +
    `<td><small>${cvrStr1(w.tot, pats.reduce((a, p) => a + pSess(p.id, w.dates), 0))}</small></td>`).join('') + '</tr>';
  const cols2 = weeks.map((w) => `<th colspan="3">CW ${isoWeekNo(w.from)}${w.partial ? ' (partial)' : ''}<br><small style="font-weight:400">${fmtDM(w.from)}–${fmtDM(w.to)}</small></th>`).join('');
  const subCols2 = weeks.map(() => '<th class="attrSub">Share</th><th class="attrSub">Trials</th><th class="attrSub">CVR</th>').join('');
  $('attrWrap').innerHTML += '<h3 style="margin:20px 0 6px">Started trials by entry URL pattern</h3>' +
    `<table><thead><tr><th rowspan="2">URL pattern</th>${cols2}</tr><tr>${subCols2}</tr></thead><tbody>${rows2}${totRow2}</tbody></table>` +
    '<p class="tlIntro" style="margin-top:6px">The same weeks, split by the dashboard URL pattern the signup\'s entry page matches (without the selected page sets, the /drivers/ MCP and Cloud pages and the aggregates; the listed patterns are URL-disjoint, so each trial counts exactly once). Share = share of the listed patterns\' trials that week; CVR = the pattern\'s trials ÷ its engaged sessions (all traffic, GA4 — the last two days are still settling, so the newest week reads high). Trials whose entry page matches none of the listed patterns (app signups, unmatched pages) appear only in the entry-category table above. Opportunities are attributed per entry channel, not per URL pattern — hence no Opps column.</p>';
}

// ISO week number of a YYYY-MM-DD date
function isoWeekNo(ds) {
  const d = new Date(ds + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + 3 - ((d.getUTCDay() + 6) % 7));
  const jan4 = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7);
}

// ---- single-page lookup (local-only) ----------------------------------------
// Free-text [datasource] / [llm] fields resolve to the real URL slugs from the
// live page inventory ("Microsoft Dynamics 365 Business Central" →
// d365businesscentral), then one on-request GA4 query renders the page's
// numbers in the familiar weekly table. Only shown where the local dashboard
// server (and through it the Connect Engine) responds.
let slugInventory = null; // {ds, llm, singles} from /api/page-slugs (cached daily server-side)
let lookupResult = null;  // last lookup: {pattern, days, start, end}

const normTerm = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
function lcsLen(a, b) { // longest common substring
  let best = 0;
  const m = new Array(b.length + 1).fill(0);
  for (let i = 1; i <= a.length; i++) {
    let prev = 0;
    for (let j = 1; j <= b.length; j++) {
      const t = m[j];
      m[j] = a[i - 1] === b[j - 1] ? prev + 1 : 0;
      if (m[j] > best) best = m[j];
      prev = t;
    }
  }
  return best;
}
// rank candidate slugs against the user's wording. Primary signal: how much of
// the typed wording the slug explains (word coverage — so "Microsoft Dynamics
// 365 Business Central" prefers d365businesscentral over the shorter
// dynamics365); raw overlap and containment act as tie-breakers.
function matchSlugs(input, cands) {
  const q = normTerm(input);
  if (!q) return [];
  const tokens = String(input).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  return cands
    .map((slug) => {
      const s = normTerm(slug);
      let score;
      if (s === q) score = 2;
      else {
        const covered = tokens.reduce((a, t) => a + (s.includes(t) ? t.length : 0), 0);
        score = covered / q.length
          + (lcsLen(s, q) / Math.max(s.length, q.length)) * 0.5
          + ((s.includes(q) || q.includes(s)) ? 0.25 : 0);
      }
      return { slug, score };
    })
    .filter((x) => x.score >= 0.35)
    .sort((a, b) => b.score - a.score)
    .slice(0, 4);
}

function renderLookupTable() {
  if (!lookupResult) return;
  const { pattern, days, start, end } = lookupResult;
  const dates = dateList(start, end);
  const weeks = [];
  for (const date of dates) {
    const last = weeks[weeks.length - 1];
    if (!last || parseDate(date).getUTCDay() === 1) weeks.push({ dates: [date] });
    else last.dates.push(date);
  }
  const weeklyCols = weeks.map((w) => ({ label: weekLabel(w), dates: w.dates, weekstart: true }));
  $('lookupWrap').innerHTML = buildTable(pattern, days, weeklyCols, null);
  $('lookupWrap').scrollLeft = $('lookupWrap').scrollWidth;
}

const altSpan = (field, c) => `<span class="lookupAlt" data-field="${field}" data-slug="${c.slug}" title="Use this slug instead">${c.slug}</span>`;

async function runLookup() {
  const st = $('lookupStatus'), resEl = $('lookupResolved');
  const dsIn = $('lookupDs').value.trim(), llmIn = $('lookupLlm').value.trim();
  if (!dsIn && !llmIn) { st.textContent = 'enter a datasource (and optionally an LLM)'; return; }
  $('lookupBtn').disabled = true;
  try {
    if (!slugInventory) {
      st.textContent = 'loading the live page inventory…';
      const r = await fetch(API + '/api/page-slugs');
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'inventory failed');
      slugInventory = j;
    }
    const notes = [];
    let ds = '', llm = '';
    if (dsIn) {
      // without an LLM the term may also mean a single page (e.g. "claude")
      const cands = matchSlugs(dsIn, llmIn ? slugInventory.ds : [...new Set([...slugInventory.ds, ...slugInventory.singles])]);
      if (!cands.length) throw new Error(`no /ai/connect/ page matches “${dsIn}”`);
      ds = cands[0].slug;
      notes.push(`“${dsIn}” → <code>${ds}</code>` +
        (cands.length > 1 ? ` <small>(or: ${cands.slice(1).map((c) => altSpan('lookupDs', c)).join(', ')})</small>` : ''));
    }
    if (llmIn) {
      const cands = matchSlugs(llmIn, dsIn ? slugInventory.llm : [...new Set([...slugInventory.llm, ...slugInventory.singles])]);
      if (!cands.length) throw new Error(`no LLM slug matches “${llmIn}”`);
      llm = cands[0].slug;
      notes.push(`“${llmIn}” → <code>${llm}</code>` +
        (cands.length > 1 ? ` <small>(or: ${cands.slice(1).map((c) => altSpan('lookupLlm', c)).join(', ')})</small>` : ''));
    }
    const pathDs = ds || llm, pathLlm = ds ? llm : '';
    st.textContent = 'querying GA4 (first lookup per page and day — cached afterwards)…';
    const r2 = await fetch(API + `/api/page-lookup?ds=${encodeURIComponent(pathDs)}${pathLlm ? '&llm=' + encodeURIComponent(pathLlm) : ''}`);
    const data = await r2.json();
    if (!r2.ok) throw new Error(data.error || 'lookup failed');
    resEl.innerHTML = notes.join(' · ') +
      ` · page <a class="patLink" href="https://www.cdata.com${data.pagePath}" target="_blank">${data.pagePath} ↗</a>`;
    const total = Object.values(data.days).reduce((a, d) => a + d.s.all, 0);
    st.textContent = total ? '' : 'no engaged sessions recorded on this page in the whole range';
    lookupResult = {
      pattern: { id: '__lookup:' + data.pagePath, label: data.pagePath, lookup: true, trials: data.trials || null },
      days: data.days, start: data.start, end: data.end,
    };
    renderLookupTable();
  } catch (e) {
    st.textContent = '✗ ' + e.message;
  } finally {
    $('lookupBtn').disabled = false;
  }
}
$('lookupBtn').addEventListener('click', runLookup);
$('lookupDs').addEventListener('keydown', (e) => { if (e.key === 'Enter') runLookup(); });
$('lookupLlm').addEventListener('keydown', (e) => { if (e.key === 'Enter') runLookup(); });
$('lookupResolved').addEventListener('click', (e) => {
  const alt = e.target.closest('.lookupAlt');
  if (!alt) return;
  $(alt.dataset.field).value = alt.dataset.slug;
  runLookup();
});

$('refreshBtn').addEventListener('click', async () => {
  const btn = $('refreshBtn');
  btn.disabled = true;
  btn.textContent = 'Refreshing…';
  try {
    await fetch(API + '/api/refresh', { method: 'POST' });
  } catch {
    btn.disabled = false;
    btn.textContent = 'Refresh data';
    alert('The dashboard server is not running.\n\nStart it once (it launches the data engine by itself):\n' +
      'cd teams\\team-5\\ctr-dashboard && node server.js\n\nOr open http://localhost:3010 from a running session.');
    return;
  }
  const poll = setInterval(async () => {
    let st;
    try {
      st = await (await fetch(API + '/api/refresh')).json();
    } catch { return; } // transient — keep polling
    if (st.running) {
      btn.textContent = (st.step || 'Refreshing') + '…';
      return;
    }
    clearInterval(poll);
    btn.disabled = false;
    btn.textContent = 'Refresh data';
    if (st.lastError) {
      alert('Refresh failed: ' + st.lastError);
    } else if (window.__EMBEDDED__) {
      // pull the fresh data into this static page; the file on disk was
      // rewritten too, so the bookmark is current on next full reload
      PAYLOAD = await (await fetch(API + '/api/data')).json();
      render();
      renderExperiments();
    } else {
      await load();
    }
  }, 3000);
});

load();
</script>
</body>
</html>
