<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CAI Top-of-Funnel Dashboard & Web Experiments</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100..1000&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root {
    /* CData brand kit (Feb 2026): Depth/Clarity/Agility/Resolve/Balance + grayscale */
    --surface: #f9f9f7;      /* kept for a seamless blend with the portal view */
    --border: #d9d6d2;       /* Gray 3 */
    --border-strong: #b5b9bc;/* Balance */
    --head-bg: #fff38c;      /* Agility 45% tint — column headers */
    --week-bg: #ffe500;      /* Agility — top header tier */
    --label-bg: #fffdfa;     /* Gray 1 */
    --sess-bg: #fffdfa;      /* Gray 1 */
    --evt-bg: #f1eee9;       /* Clarity */
    --extra-bg: #edeeef;     /* Balance 25% tint */
    --ctr-bg: #fffacc;       /* Agility 20% tint */
    --text: #15151c;         /* Depth */
    --muted: #5e5d60;        /* Gray 8 */
    --faint: #777577;        /* Gray 7 */
    --accent: #002660;       /* Resolve */
    --critical: #d03b3b;     /* off-palette by design: destructive-action affordance */
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 11.5px/1.4 "DM Sans", Arial, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: #f9f9f7; }
  code { font-family: "DM Mono", "Courier New", monospace; }
  .page { max-width: 1500px; margin: 0 auto; background: var(--surface); min-height: 100vh; }
  header { padding: 14px 20px 10px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;
           position: sticky; top: 0; z-index: 60; background: var(--surface); }
  #patternBar, #tlBar { position: sticky; top: var(--headerH, 48px); z-index: 55; padding: 7px 20px; border-bottom: 1px solid var(--border); background: var(--label-bg); }
  #patternBar select, #tlBar select { font: inherit; padding: 4px 8px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); min-width: 320px; }
  h1 { font-size: 14px; margin: 0; font-weight: 650; }
  h2 { font-size: 12.5px; margin: 22px 20px 8px; font-weight: 650; }
  #topTabs { display: flex; gap: 2px; }
  #topTabs button { border: 1px solid var(--border-strong); border-radius: 7px 7px 0 0; border-bottom: none; background: #f1eee9; padding: 6px 16px; font-size: 12px; color: var(--muted); cursor: pointer; }
  #topTabs button.active { background: var(--surface); color: var(--text); font-weight: 650; border-bottom: 2px solid var(--surface); margin-bottom: -2px; }
  #expWrap.tableWrap { overflow: visible; } /* page scrolls; column headers stick below the app header */
  #expWrap table { width: 100%; table-layout: fixed; }
  #expWrap th, #expWrap td { text-align: left; white-space: pre-line; vertical-align: top; overflow-wrap: break-word; }
  #expWrap thead th { position: sticky; top: var(--headerH, 48px); z-index: 2; }
  .infoI { display: inline-block; width: 13px; height: 13px; border-radius: 50%; background: var(--muted); color: #fff;
           font: italic 600 9.5px/13px Georgia, serif; text-align: center; cursor: help; vertical-align: 1px; }
  .infoI:hover { background: var(--accent); }
  #expWrap .titleCell, #expWrap .dateCell { cursor: text; }
  #expWrap .titleCell:hover, #expWrap .dateCell:hover { outline: 1px dashed var(--border-strong); outline-offset: 2px; }
  .imgWrap { position: relative; margin-bottom: 5px; }
  .cellImg { display: block; max-width: 100%; border: 1px solid var(--border); border-radius: 4px; }
  .imgDel { position: absolute; top: 3px; right: 3px; border: none; border-radius: 3px; background: rgba(255,255,255,.85); font-size: 10px; padding: 1px 5px; cursor: pointer; color: var(--muted); }
  .imgDel:hover { color: var(--critical); }
  .imgAdd { display: block; margin-top: 4px; border: 1px dashed var(--border-strong); border-radius: 5px; background: none; font-size: 10px; padding: 1px 7px; color: var(--muted); cursor: pointer; }
  .imgAdd:hover { color: var(--accent); border-color: var(--accent); }
  .updBtn { display: block; margin-top: 4px; border: 1px solid var(--border-strong); border-radius: 5px; background: var(--surface); font-size: 10px; padding: 1px 7px; color: var(--muted); cursor: pointer; }
  .updBtn:hover { color: var(--accent); border-color: var(--accent); }
  .updPending { font-size: 10px; font-style: italic; color: var(--text); background: #fff38c; border-radius: 4px; padding: 2px 6px; margin-bottom: 4px; }
  #expWrap .titleCell:hover { outline: 1px dashed var(--border-strong); outline-offset: 2px; }
  #expWrap tbody tr:nth-child(even) td { background: var(--label-bg); }
  #expWrap .cellText { display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  #expWrap tr.expanded .cellText { -webkit-line-clamp: unset; }
  #expWrap tr.newRow td { cursor: pointer; height: 26px; color: var(--muted); font-style: italic; }
  #expWrap tr.newRow:hover td { background: var(--head-bg); }
  #expWrap input, #expWrap select, #expWrap textarea { font: inherit; font-size: 10px; padding: 3px 5px; border: 1px solid var(--border-strong); border-radius: 5px; width: 100%; box-sizing: border-box; }
  #expWrap textarea { min-height: 80px; resize: vertical; }
  #expWrap thead th { background: var(--week-bg); font-weight: 650; }
  #expWrap .delX { border: none; background: none; color: var(--muted); cursor: pointer; }
  #expWrap .delX:hover { color: var(--critical); }
  .meta { color: var(--muted); font-size: 11.5px; }
  .meta code, #eventsLine code { background: #f1eee9; padding: 1px 5px; border-radius: 4px; font-size: 10.5px; }
  button { font: inherit; padding: 5px 12px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }
  #eventsDefs { border-bottom: 1px solid var(--border); }
  #eventsDefs > summary { padding: 8px 20px; font-size: 11.5px; font-weight: 600; color: var(--muted); cursor: pointer; user-select: none; list-style-position: inside; margin: 0; }
  #eventsDefs > summary:hover { color: var(--text); }
  #eventsLine { padding: 0 20px 10px; color: var(--muted); font-size: 11.5px; }
  .tableWrap { overflow: auto; max-height: 72vh; margin: 0 0 8px; }
  table { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
  th, td { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 2px 5px; text-align: right; white-space: nowrap; font-size: 10px; }
  thead th { position: sticky; background: var(--head-bg); z-index: 3; }
  thead tr.weeks th { top: 0; text-align: center; background: var(--week-bg); font-weight: 650; border-bottom: 1px solid var(--border-strong); }
  thead tr.days th { top: 20px; font-weight: 550; color: var(--text); }
  thead tr.days:first-child th { top: 0; }
  tbody th { position: sticky; left: 0; background: var(--label-bg); text-align: left; font-weight: 550; z-index: 2; border-right: 1px solid var(--border-strong); min-width: 210px; }
  tbody th small { color: var(--muted); font-weight: 450; }
  thead th.corner { left: 0; z-index: 4; background: var(--head-bg); }
  /* box-shadow instead of border: takes no layout space, so fixed-grid tables stay pixel-aligned */
  td.weekstart, th.weekstart { box-shadow: inset 2px 0 0 var(--border-strong); }
  /* weekend tint as an overlay, so row backgrounds shine through */
  td.wknd, th.wknd { box-shadow: inset 0 0 0 999px rgba(21, 21, 28, .05); }
  .grpToggle { border: none; background: none; cursor: pointer; font-size: 9px; padding: 0 4px 0 0; color: var(--muted); }
  .grpToggle:hover { color: var(--accent); }
  .agentToggle { border: 1px solid var(--border-strong); border-radius: 4px; background: var(--surface); cursor: pointer; font-size: 9px; padding: 0 5px; margin-left: 6px; color: var(--muted); }
  .agentToggle:hover { color: var(--accent); border-color: var(--accent); }
  tr.subEvt th { padding-left: 26px; }
  tr.sess td { background: var(--sess-bg); }
  /* Salesforce-sourced trial rows (count + CVR): highlighted as a block —
     stronger Resolve tint + accent bar on the row label */
  /* gold like the trials line in the chart */
  tr.trials td { background: var(--ctr-bg); font-weight: 600; }
  tr.trials th { box-shadow: inset 3px 0 0 #ccb700; }
  tr.evctr.trials td { background: #fffde6; font-weight: 400; } /* CVR sub-rows: lighter tint */
  tr.evt td { background: var(--evt-bg); }
  tr.extra td { background: var(--extra-bg); }
  tr.ctr td { background: var(--ctr-bg); font-weight: 600; }
  /* highlighted key-metric block: free trial clicks + its CTR sub-row */
  /* blue like the CTR line in the chart (free-trial clicks = the CTR metric) */
  tr.hl td { background: #dbe4f0; font-weight: 600; }
  tr.hl th { box-shadow: inset 3px 0 0 var(--accent); }
  tr.evctr.hl td { background: #e8eef7; }
  tr.evctr td, tr.evctr th { font-size: 9.5px; font-style: italic; color: var(--muted); padding-top: 0; padding-bottom: 2px; }
  tr.evctr td { background: var(--evt-bg); }
  tr.evctr.extra td { background: var(--extra-bg); }
  td.out { background: #f1eee9; }
  /* blank cells in the aligned experiment-periods table: keep the grid width
     for scroll alignment with the daily table, but show nothing */
  .rangeCard th.gap, .rangeCard td.gap { background: var(--surface); border-right: none; border-bottom: none; box-shadow: none; }
  th.out { color: #c0bebb; }
  td.span { text-align: center; font-weight: 650; }
  tr.blockend td, tr.blockend th { border-bottom: 2px solid var(--border-strong); }
  td.zero { color: #c0bebb; }
  #empty { padding: 40px; color: var(--muted); }
  /* experiment timeline tab */
  #tlCharts { padding: 10px 20px 50px; }
  .tlIntro { color: var(--muted); font-size: 11.5px; max-width: 860px; }
  .tlChart { margin: 26px 0 6px; }
  .tlChart h3 { font-size: 13.5px; margin: 0 0 2px; }
  .tlChart .meta { display: block; margin-bottom: 8px; }
  .tlChart svg { width: 100%; height: auto; display: block; }
  .tlEvalLane { position: relative; margin-top: 6px; }
  .tlEvalBlock { position: absolute; top: 0; box-sizing: border-box; font-size: 10px; line-height: 1.35; padding: 5px 8px;
                 background: var(--label-bg); border: 1px solid var(--border); border-left: 3px solid #ffe500;
                 border-radius: 0 6px 6px 0; cursor: help; overflow-wrap: break-word;
                 min-width: min(230px, 100%); max-width: 100%; }
  .tlEvalBlock .evalTxt { color: var(--muted); }
  .patLink { color: inherit; text-decoration: none; }
  .patLink:hover { color: var(--accent); text-decoration: underline; }
  /* experiment titles in the timeline charts link to their Experimentation Log row */
  #tlCharts text.expLink { cursor: pointer; fill: var(--accent); }
  #tlCharts text.expLink:hover { text-decoration: underline; }
  /* compact experiment-summary table on the CAI tab */
  .expSum table { border-collapse: collapse; margin: 0 12px 10px; }
  .expSum th, .expSum td { padding: 4px 12px; border: 1px solid var(--border); text-align: center; white-space: nowrap; }
  .expSum thead th { background: var(--head-bg); text-align: center; }
  .expSum tbody th { text-align: left; background: var(--label-bg); }
  .expSum span.expLink, .funnelStage span.expLink { cursor: pointer; color: var(--accent); font-weight: 600; }
  .expSum span.expLink:hover, .funnelStage span.expLink:hover { text-decoration: underline; }
  td .cellNote { cursor: help; color: var(--accent); font-size: 8px; margin-left: 2px; font-weight: 700; }
  #lookupPanel { margin: 6px 0 10px; }
  #lookupPanel > summary { cursor: pointer; font-weight: 600; }
  #lookupForm { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 8px 0 4px; }
  #lookupResolved { margin: 2px 0 8px; }
  #lookupResolved .lookupAlt { cursor: pointer; color: var(--accent); text-decoration: underline dotted; }
  .expSum .rangeHead .meta { font-size: 10px; }
  #expWrap tr.flash td { box-shadow: inset 0 0 0 999px rgba(255, 229, 0, .35); transition: box-shadow .4s; }
  /* weekly summary: centered values (row labels and the corner stay left-aligned) */
  #weeklyWrap td, #weeklyWrap thead th, #lookupWrap td, #lookupWrap thead th { text-align: center; }
  #weeklyWrap thead th.corner, #weeklyWrap tbody th, #lookupWrap thead th.corner, #lookupWrap tbody th { text-align: left; }
  #ctrChart { padding: 0; } /* chart spans the entire page width */
  /* Funnel View tab */
  #funnelView { padding: 6px 20px 30px; }
  #funnelView .tlIntro { max-width: none; }
  #funnelBody { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  #funnelSpine { flex: 1 1 560px; min-width: 480px; display: flex; flex-direction: column; align-items: center; }
  #funnelSide { flex: 1 1 320px; min-width: 300px; display: flex; flex-direction: column; gap: 14px; }
  .funnelStage { border: 1px solid var(--border-strong); border-radius: 4px; padding: 10px 16px 12px; background: var(--label-bg); text-align: center; }
  .funnelStage details > summary { font-size: 10px; color: var(--muted); cursor: pointer; margin: 6px 0 0; user-select: none; list-style-position: inside; }
  .funnelStage details[open] p, .funnelStage details[open] .fpat { text-align: left; }
  #funnelSpine .funnelStage { margin-bottom: 4px; }
  .funnelStage h3 { margin: 0 0 2px; font-size: 12.5px; }
  .funnelStage .frole { color: var(--muted); font-style: italic; margin: 0 0 6px; }
  .funnelStage .fnums { font-weight: 600; margin: 6px 0; }
  .funnelStage .fnums small { font-weight: 400; color: var(--muted); }
  .funnelStage p { margin: 6px 0 0; }
  .funnelStage .fpat { margin: 4px 0 0; color: var(--muted); }
  .funnelStage .fpat code { font-size: 10px; }
  .funnelStage .fcta { color: var(--muted); border-top: 1px dashed var(--border); padding-top: 5px; }
  .funnelStage .fcta strong { color: var(--text); }
  .funnelArrow { color: var(--faint); font-size: 15px; line-height: 1; margin: 0 0 4px; }
  .funnelChip { display: inline-block; background: var(--evt-bg); border: 1px solid var(--border); border-radius: 3px;
                padding: 1px 7px; margin: 2px 4px 2px 0; font-family: "DM Mono", "Courier New", monospace; font-size: 10px;
                cursor: pointer; }
  .funnelChip:hover { border-color: var(--accent); color: var(--accent); }
  #attrView { padding: 6px 20px 24px; }
  #attrView .tlIntro { max-width: none; } /* explanations span the full app width */
  #attrWrap { max-width: 100%; margin-top: 14px; }
  #attrChart svg { width: 100%; height: auto; }
  #attrView table { border-collapse: collapse; }
  #attrView th, #attrView td { padding: 3px 7px; text-align: center; border: 1px solid var(--border); }
  #attrView th:first-child { text-align: left; max-width: 200px; white-space: normal; overflow-wrap: break-word; }
  #attrView thead th { background: var(--head-bg); white-space: normal; font-size: 10px; min-width: 48px; text-align: center; }
  #attrView thead th.attrSub { background: var(--label-bg); font-size: 9px; color: var(--muted); min-width: 46px; }
  #attrView td.attrShare { text-align: center; font-weight: 600; }
  #ctrChart .tlChart { margin: 12px 0 2px; }
  #ctrChart .tlChart h3 { font-size: 10.5px; margin: 0 20px 1px; }
  #ctrChart .tlChart .meta { font-size: 10.5px; margin: 0 20px 4px; }
  details > summary { font-size: 13.5px; font-weight: 650; margin: 18px 20px 8px; cursor: pointer; list-style-position: inside; user-select: none; }
  /* full-width, no side border/margin — keeps its columns pixel-aligned with the daily table */
  .rangeCard { margin: 14px 0; border-top: 2px solid var(--border-strong); border-bottom: 2px solid var(--border-strong); overflow: hidden; }
  .rangeCard .rangeHead { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; background: var(--head-bg); border-bottom: 1px solid var(--border); }
  .rangeCard .rangeHead strong { font-size: 12.5px; }
  .rangeCard .closeX { border: none; background: none; font-size: 17px; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 6px; }
  .rangeCard .closeX:hover { color: var(--critical); }
  .rangeCard .tableWrap { max-height: 60vh; margin: 0; }
  #rangeControls { padding: 12px 20px 36px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #rangeControls input[type="date"] { font: inherit; padding: 4px 7px; border: 1px solid var(--border-strong); border-radius: 6px; }
</style>
</head>
<body>
<div class="page">
<header>
  <h1>CAI Top-of-Funnel Dashboard &amp; Web Experiments</h1>
  <nav id="topTabs">
    <button data-view="attr" class="active">Trial Attribution</button>
    <button data-view="ctr">CAI Traffic, CTR &amp; Trials</button>
    <button data-view="tl">Experiment Timeline</button>
    <button data-view="exp">Experimentation Log</button>
    <button data-view="funnel">Visitor Intent</button>
  </nav>
  <span class="meta" id="rangeMeta"></span>
  <button id="refreshBtn" title="Re-fetch recent days from GA4 via the Connect Engine">Refresh data</button>
</header>

<div id="ctrView" hidden>
<div id="patternBar">
  <label>URL pattern:
    <select id="patternSelect"></select>
  </label>
  <label style="margin-left:18px">Traffic:
    <select id="ctrBucketSel" style="min-width:140px">
      <option value="all">All</option>
      <option value="paid">Paid</option>
      <option value="organic">Organic</option>
      <option value="direct">Direct</option>
    </select>
  </label>
</div>
<details id="lookupPanel" hidden>
  <summary>🔎 Single-page lookup <small>(local — queries GA4 live, on request only)</small></summary>
  <div id="lookupForm">
    <label>Datasource: <input id="lookupDs" type="text" placeholder="e.g. Microsoft Dynamics 365 Business Central" size="34"></label>
    <label>LLM: <input id="lookupLlm" type="text" placeholder="e.g. Claude (optional)" size="18"></label>
    <button id="lookupBtn">Analyze</button>
    <span id="lookupStatus" class="meta"></span>
  </div>
  <div id="lookupResolved" class="meta"></div>
  <div class="tableWrap" id="lookupWrap"></div>
</details>
<details id="eventsDefs"><summary>Data definitions</summary><div id="eventsLine"></div></details>
<div id="ctrChart"></div>
<details open>
  <summary>Weekly summary</summary>
  <div class="tableWrap" id="weeklyWrap"></div>
</details>
<details id="dailyDetails">
  <summary>Daily</summary>
  <div class="tableWrap" id="dailyWrap"></div>
</details>
<div id="rangeTables"></div>
<div id="rangeControls">
  <button id="addRangeBtn">Set date range</button>
  <span id="rangeForm" hidden>
    <input type="date" id="rangeStart"> → <input type="date" id="rangeEnd">
    <button id="rangeApply">Show</button>
    <button id="rangeCancel">Cancel</button>
  </span>
</div>
<div id="empty" hidden>No data snapshot yet — run <code>node fetch-data.js</code> first.</div>
</div>

<div id="expView" hidden>
  <div class="tableWrap" id="expWrap" style="max-height:none"></div>
</div>

<div id="funnelView" hidden>
  <div id="funnelIntro"></div>
  <div id="funnelBody">
    <div id="funnelSpine"></div>
    <div id="funnelSide"></div>
  </div>
</div>

<div id="attrView">
  <div id="attrIntro"></div>
  <div id="attrChart"></div>
  <div class="tableWrap" id="attrWrap"></div>
</div>

<div id="tlView" hidden>
  <div id="tlBar">
    <label>URL pattern:
      <select id="tlFilter"></select>
    </label>
  </div>
  <div id="tlCharts"></div>
</div>
</div>

<!-- EMBED_DATA -->
<script>
'use strict';
let PAYLOAD = null;

const $ = (id) => document.getElementById(id);
const fmtInt = (n) => n.toLocaleString('en-US');
const BUCKETS = ['all', 'paid', 'organic', 'direct'];
const BUCKET_LABEL = { all: 'All', paid: 'Paid', organic: 'Organic', direct: 'Direct' };

function parseDate(s) { return new Date(s + 'T00:00:00Z'); }
function iso(d) { return d.toISOString().slice(0, 10); }
function addDays(d, n) { const x = new Date(d); x.setUTCDate(x.getUTCDate() + n); return x; }

function isoWeek(d) {
  const t = new Date(d);
  t.setUTCDate(t.getUTCDate() + 3 - ((t.getUTCDay() + 6) % 7)); // ISO week's Thursday
  const week1 = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  const wk = 1 + Math.round(((t - week1) / 86400000 - 3 + ((week1.getUTCDay() + 6) % 7)) / 7);
  return { week: wk, year: t.getUTCFullYear() };
}

function dateList(start, end) {
  const out = [];
  for (let d = parseDate(start); d <= parseDate(end); d = addDays(d, 1)) out.push(iso(d));
  return out;
}

const fmtShort = (s) => `${s.slice(8, 10)}.${s.slice(5, 7)}.`;
const fmtDay = fmtShort; // day columns: date only, keeps columns narrow
const isWeekend = (s) => { const wd = parseDate(s).getUTCDay(); return wd === 0 || wd === 6; };
const weekLabel = (w) => {
  const { week, year } = isoWeek(parseDate(w.dates[0]));
  return `CW ${String(week).padStart(2, '0')}/${year} · ${fmtShort(w.dates[0])}–${fmtShort(w.dates[w.dates.length - 1])}${w.dates[0].slice(0, 4)}`;
};

// ---- per-column metric accessors -----------------------------------------
// A "column" is a list of dates (one for daily, a whole week for the summary).
function sessSum(days, dates, bucket) {
  return dates.reduce((a, d) => a + (days[d]?.s[bucket] ?? 0), 0);
}
function eventSum(days, dates, eventNames, bucket) {
  let total = 0;
  for (const d of dates) {
    const e = days[d]?.e;
    if (!e) continue;
    for (const name of eventNames) total += e[name]?.[bucket] ?? 0;
  }
  return total;
}

// ---- metric row definitions (shared by daily / weekly / range tables) ------
// Events are auto-discovered from the snapshot (cc_ai_* + all_button_clicks):
// whatever GA4 recorded on pages matching the pattern shows up automatically.
function discoveredEvents(days) {
  const totals = {};
  for (const day of Object.values(days)) {
    for (const [name, v] of Object.entries(day.e)) totals[name] = (totals[name] || 0) + v.all;
  }
  return totals;
}
// CTR / Events Total cover all discovered cc_ai_* events; all_button_clicks stays outside
const ctrEventsOf = (days) => Object.keys(discoveredEvents(days)).filter((n) => n.startsWith('cc_ai_'));

// events named after an AI agent (basis of the all_ai_agent_clicks aggregate)
const AGENT_TOKENS = ['claude', 'chatgpt', 'gemini', 'copilot', 'agentforce', 'langchain',
  'openai', 'servicenow', 'crewai', 'gumloop', 'n8n', 'claude code'];
// fixed display order for the trial-intent CTA breakdown (per Christof);
// events not listed here follow after, by volume
const AGENT_EVENT_ORDER = ['cc_ai_claude_app', 'cc_ai_chatgpt_app', 'cc_ai_claude_trial',
  'cc_ai_chatgpt_trial', 'cc_ai_copilot_trial', 'cc_ai_gemini_trial', 'cc_ai_openai_trial',
  'cc_ai_servicenow_trial', 'cc_ai_n8n_trial', 'cc_ai_agentforce_trial', 'cc_ai_crewai_trial',
  'cc_ai_gumloop_trial', 'cc_ai_langchain_trial'];
const agentEventsOf = (days) =>
  Object.keys(discoveredEvents(days)).filter((n) => AGENT_TOKENS.some((t) => n.includes(t)));

const TRAFFIC_TIP = { all: 'All traffic', paid: 'Paid traffic', organic: 'Organic traffic', direct: 'Direct traffic' };

// keep sticky offsets in sync with the (possibly wrapping) header's height
const setHeaderH = () =>
  document.documentElement.style.setProperty('--headerH', document.querySelector('header').offsetHeight + 'px');
window.addEventListener('resize', setHeaderH);
setHeaderH();
const expandedGroups = new Set(); // event blocks whose channel breakdown is open
const expandedAgentGroups = new Set(); // patterns whose AI-agent breakdown is open

// one delegated listener survives every re-render
document.getElementById('ctrView').addEventListener('click', (e) => {
  const ag = e.target.closest('.agentToggle');
  if (ag) {
    const k = ag.dataset.key;
    expandedAgentGroups.has(k) ? expandedAgentGroups.delete(k) : expandedAgentGroups.add(k);
    render();
    renderLookupTable(); // the lookup table shares the toggle state
    return;
  }
  const btn = e.target.closest('.grpToggle');
  if (!btn) return;
  const g = btn.dataset.group;
  expandedGroups.has(g) ? expandedGroups.delete(g) : expandedGroups.add(g);
  render();
  renderLookupTable();
});

function metricRows(pattern, days) {
  const rows = [];
  let curTip = '';
  const push = (label, cls, fn, blockend) => rows.push({ label, cls, fn, blockend, tip: curTip });
  const ctrStr = (dates, evNames, b) => {
    const s = sessSum(days, dates, b);
    if (!s) return '-';
    return ((eventSum(days, dates, evNames, b) / s) * 100).toFixed(1) + '%';
  };

  // 1) engaged sessions
  BUCKETS.forEach((b, i) => {
    curTip = TRAFFIC_TIP[b];
    push(`Engaged Sessions — ${BUCKET_LABEL[b]}`, 'sess', (dates) => fmtInt(sessSum(days, dates, b)), i === 3);
  });

  // 3) started trials, attributed via the Salesforce lead field
  // Entry_Attribution__c (entry page of the Connect AI signup). Lead-level
  // data — no GA4 traffic-type split, so the row ignores the Traffic selector.
  // shown for every pattern as soon as any trials data exists — a pattern
  // without matching signups shows 0 (tracked days) / "–" (pre-tracking).
  // Compact by default (All); the ▸ toggle expands the paid/organic/direct
  // split. Trial buckets come from the Salesforce Source Category (mapped
  // like GA4 channel groups: Referral/AI Referral/unclassified count in All
  // only); sessions come from GA4 — independent systems, so per-bucket CVRs
  // are approximations.
  // (rendered AFTER the free-trial-clicks block — funnel order traffic → clicks → trials)
  // single-page lookups carry their own per-page trials (queried live from
  // Salesforce by the lookup endpoint) instead of the snapshot's per-pattern data
  const trials = pattern.lookup
    ? (pattern.trials || null)
    : (PAYLOAD.snapshot?.trials ? (PAYLOAD.snapshot.trials[pattern.id] || {}) : null);
  const pushTrialsRows = () => {
    if (!trials) return;
    const tStart = PAYLOAD.snapshot.trialsStart || '';
    const trackedOf = (dates) => (tStart ? dates.filter((d) => d >= tStart) : dates);
    const trialSum = (dates, b) => dates.reduce((a, d) => a + (trials[d]?.[b] ?? 0), 0);
    const tGrp = 'Started Trials';
    const tExpanded = expandedGroups.has(tGrp);
    const tBuckets = tExpanded ? BUCKETS : ['all'];
    const tToggle = `<button class="grpToggle" data-group="${tGrp}" title="${tExpanded ? 'Hide' : 'Show'} the paid/organic/direct split (trial source from the Salesforce Source Category)">${tExpanded ? '▾' : '▸'}</button>`;
    tBuckets.forEach((b, i) => {
      const srcNote = b === 'all'
        ? 'All trials, incl. sources outside paid/organic/direct (Referral, AI Referral, Events, unclassified).'
        : `Trials whose Salesforce Source Category maps to ${BUCKET_LABEL[b]} traffic.`;
      curTip = `Started trials whose signup entry page matches this URL pattern — from the Salesforce lead field Entry_Attribution__c (leads with a Connect AI account). ${srcNote}${tStart ? ` Tracked since ${tStart} — earlier days show “–”.` : ''}`;
      push(`${b === 'all' ? tToggle : ''}Started Trials <small>(Entry Attribution)</small> — ${BUCKET_LABEL[b]}`, 'trials',
        (dates) => {
          const tracked = trackedOf(dates);
          if (!tracked.length) return '-'; // before tracking went live: no data, not zero
          return fmtInt(trialSum(tracked, b));
        }, false);
      curTip = `Trial conversion rate: ${BUCKET_LABEL[b]} trials ÷ ${BUCKET_LABEL[b]} engaged sessions${tStart ? ` (tracked days since ${tStart} only)` : ''}. Trial source from Salesforce, sessions from GA4 — independent classifications, treat per-channel CVRs as approximations.`;
      push(`<small><em>↳ CVR — ${BUCKET_LABEL[b]}</em></small>`, 'evctr trials',
        (dates) => {
          const tracked = trackedOf(dates);
          if (!tracked.length) return '-';
          const s = sessSum(days, tracked, b);
          return s ? ((trialSum(tracked, b) / s) * 100).toFixed(1) + '%' : '-';
        }, i === tBuckets.length - 1);
    });
  };

  // 2) each event separately: amount row + small italic CTR sub-row per bucket.
  // Compact by default: only the "All" rows show; the per-channel breakdown
  // expands via the ▸ toggle on the event's first row.
  const eventBlock = (label, evNames, cls, extraToggle = '', cellTip = null) => {
    const expanded = expandedGroups.has(label);
    const buckets = expanded ? BUCKETS : ['all'];
    const toggle = `<button class="grpToggle" data-group="${label}" title="${expanded ? 'Hide' : 'Show'} paid/organic/direct breakdown">${expanded ? '▾' : '▸'}</button>`;
    buckets.forEach((b, i) => {
      curTip = TRAFFIC_TIP[b];
      push(`${b === 'all' ? toggle : ''}<small>${label}</small> — ${BUCKET_LABEL[b]}${b === 'all' ? extraToggle : ''}`, cls, (dates) => fmtInt(eventSum(days, dates, evNames, b)), false);
      rows[rows.length - 1].cellTip = cellTip;
      push(`<small><em>↳ CTR — ${BUCKET_LABEL[b]}</em></small>`, `evctr ${cls.split(' ')[0]}`, (dates) => ctrStr(dates, evNames, b), i === buckets.length - 1);
    });
  };
  const totals = discoveredEvents(days);
  const names = Object.keys(totals);
  const agentEvents = names.filter((n) => AGENT_TOKENS.some((t) => n.includes(t)));
  // the ChatGPT trial CTA exists on /ai/ but has recorded no clicks yet — list it anyway
  if (pattern.id === 'ai' && !agentEvents.includes('cc_ai_chatgpt_trial')) agentEvents.push('cc_ai_chatgpt_trial');
  agentEvents.sort((a, b) => {
    const ia = AGENT_EVENT_ORDER.indexOf(a), ib = AGENT_EVENT_ORDER.indexOf(b);
    if (ia >= 0 && ib >= 0) return ia - ib;
    if (ia >= 0 || ib >= 0) return ia >= 0 ? -1 : 1;
    return (totals[b] || 0) - (totals[a] || 0) || a.localeCompare(b);
  });
  const hasFT = names.includes('cc_ai_free_trial');
  const trialSet = [...(hasFT ? ['cc_ai_free_trial'] : []), ...agentEvents];
  const rest = names.filter((n) => n !== 'all_button_clicks' && n !== 'cc_ai_free_trial' && !agentEvents.includes(n))
    .sort((a, b) => totals[b] - totals[a] || a.localeCompare(b));

  // 2a) trial-intent block: cc_ai_free_trial + all AI-agent clicks combined
  // (same metric as the CTR trend). The agent breakdown is collapsed beneath
  // it and expands via the ⊞ agents toggle.
  if (trialSet.length) {
    const combined = agentEvents.length > 0;
    const label = combined ? 'free trial clicks' : 'cc_ai_free_trial';
    const agKey = 'agents:' + pattern.id;
    const agOpen = expandedAgentGroups.has(agKey);
    const agToggle = combined
      ? ` <button class="agentToggle" data-key="${agKey}" title="${agOpen ? 'Hide' : 'Show'} the breakdown into the individual trial-intent CTAs (cc_ai_free_trial + the AI-agent clicks)">${agOpen ? '⊟ CTAs' : '⊞ CTAs'}</button>`
      : '';
    eventBlock(label, trialSet, 'hl', agToggle); // 'hl' = the tab's highlighted key metric
    if (combined && agOpen) {
      if (hasFT) eventBlock('↳ cc_ai_free_trial (alone)', ['cc_ai_free_trial'], 'extra subEvt');
      eventBlock('↳ all_ai_agent_clicks', agentEvents, 'extra subEvt');
      for (const ev of agentEvents) {
        // the ChatGPT trial CTA (on /ai/ and the integrations pages) fired
        // nothing before its wiring was fixed
        const tip = ((pattern.id === 'ai' || pattern.id === 'ai-integrations-llm') && ev === 'cc_ai_chatgpt_trial')
          ? (dates) => (dates.includes('2026-09-17') ? 'tracking fixed and started on 09/17/2026' : null)
          : null;
        eventBlock('↳ ' + ev, [ev], 'extra subEvt', '', tip);
      }
    }
  }

  // 3) started trials right below the clicks — funnel order traffic → clicks (CTR) → trials (CVR)
  pushTrialsRows();

  // 4) remaining (non-trial-related) events by volume, below the trial rows
  for (const ev of rest) eventBlock(ev, [ev], 'evt');

  // 5) all_button_clicks last (outside CTR semantics — neutral row style)
  if (names.includes('all_button_clicks')) eventBlock('all_button_clicks', ['all_button_clicks'], 'evt');

  // (no pattern-level totals/CTR block — per-event CTR sub-rows cover it)
  return rows;
}

// ---- table builders ---------------------------------------------------------
const LABEL_COL_PX = 210, DAY_COL_PX = 46;
// identical fixed grids let the daily table and the range cards align pixel-perfect;
// fixed layout only honors col widths exactly when the table width is explicit
const gridStyle = (n) => `table-layout:fixed;width:${LABEL_COL_PX + n * DAY_COL_PX}px`;
const colgroup = (n) =>
  `<colgroup><col style="width:${LABEL_COL_PX}px">` + `<col style="width:${DAY_COL_PX}px">`.repeat(n) + '</colgroup>';

// columns: [{label, dates, weekstart}]; weekHeader: [{label, span}] or null
function buildTable(pattern, days, columns, weekHeader, fixedGrid) {
  let html = fixedGrid
    ? `<table style="${gridStyle(columns.length)}">${colgroup(columns.length)}<thead>`
    : '<table><thead>';
  if (weekHeader) {
    html += '<tr class="weeks"><th class="corner"></th>' +
      weekHeader.map((w) => `<th colspan="${w.span}" class="weekstart">${w.label}</th>`).join('') + '</tr>';
  }
  html += '<tr class="days"><th class="corner">Metric</th>' +
    columns.map((c) => `<th class="${c.weekstart ? 'weekstart' : ''}${c.wknd ? ' wknd' : ''}">${c.label}</th>`).join('') +
    '</tr></thead><tbody>';

  for (const r of metricRows(pattern, days)) {
    html += `<tr class="${r.cls}${r.blockend ? ' blockend' : ''}"><th>${r.label}</th>`;
    for (const c of columns) {
      const v = r.fn(c.dates);
      // a row may add a date-dependent note to individual cells (e.g. a
      // tracking-start remark on the affected week/day) — shown as a visible
      // ⓘ marker that carries the note on hover
      const note = r.cellTip && r.cellTip(c.dates);
      html += `<td class="${c.weekstart ? 'weekstart' : ''}${c.wknd ? ' wknd' : ''}` +
        `${v === '0' || v === '-' ? ' zero' : ''}" title="${note || r.tip}">${v}` +
        `${note ? `<sup class="cellNote" title="${note}">ⓘ</sup>` : ''}</td>`;
    }
    html += '</tr>';
  }
  return html + '</tbody></table>';
}

// Range table: same day grid as the daily table, with each range's aggregate
// spanning exactly its date columns. Accepts several non-overlapping ranges —
// they appear side by side in the same rows, positioned under their dates.
function buildRangeTable(pattern, days, weeks, ranges, headerMode = 'weeks') {
  const allDates = weeks.flatMap((w) => w.dates);
  // segments: alternating gaps and range spans, in date order
  const segs = [];
  let cursor = 0;
  for (const r of [...ranges].sort((a, b) => (a.start < b.start ? -1 : 1))) {
    const dates = allDates.filter((d) => d >= r.start && d <= r.end);
    if (!dates.length) continue;
    const startIdx = allDates.indexOf(dates[0]);
    if (startIdx > cursor) segs.push({ gap: startIdx - cursor });
    segs.push({ dates, title: r.title || '' });
    cursor = startIdx + dates.length;
  }
  if (cursor < allDates.length) segs.push({ gap: allDates.length - cursor });

  const inAny = (d) => ranges.some((r) => d >= r.start && d <= r.end);
  // top header: calendar weeks, or one merged cell per period
  const topHeader = headerMode === 'ranges'
    ? segs.map((seg) => seg.gap
        ? `<th colspan="${seg.gap}" class="gap"></th>`
        : `<th colspan="${seg.dates.length}" class="weekstart">${seg.title ? esc(seg.title) + ' · ' : ''}` +
          `${fmtShort(seg.dates[0])}–${fmtShort(seg.dates[seg.dates.length - 1])}${seg.dates[seg.dates.length - 1].slice(0, 4)}</th>`
      ).join('')
    : weeks.map((w) => `<th colspan="${w.dates.length}" class="weekstart">${weekLabel(w)}</th>`).join('');
  let html = `<table style="${gridStyle(allDates.length)}">${colgroup(allDates.length)}<thead>` +
    `<tr class="weeks"><th class="corner"></th>${topHeader}` +
    '</tr><tr class="days"><th class="corner">Metric</th>';
  for (const w of weeks) {
    w.dates.forEach((d, i) => {
      html += inAny(d) || headerMode !== 'ranges'
        ? `<th class="${i === 0 ? 'weekstart' : ''}${isWeekend(d) ? ' wknd' : ''}${inAny(d) ? '' : ' out'}">${fmtDay(d)}</th>`
        : '<th class="gap"></th>';
    });
  }
  html += '</tr></thead><tbody>';

  for (const r of metricRows(pattern, days)) {
    html += `<tr class="${r.cls}${r.blockend ? ' blockend' : ''}"><th>${r.label}</th>`;
    for (const seg of segs) {
      if (seg.gap) {
        html += `<td class="${headerMode === 'ranges' ? 'gap' : 'out'}" colspan="${seg.gap}"></td>`;
      } else {
        const v = r.fn(seg.dates);
        html += `<td class="span${v === '0' || v === '-' ? ' zero' : ''}" colspan="${seg.dates.length}" ` +
          `title="${r.tip}">${v}</td>`;
      }
    }
    html += '</tr>';
  }
  return html + '</tbody></table>';
}

function render() {
  const { snapshot, patterns } = PAYLOAD;
  if (!snapshot) { $('empty').hidden = false; $('dailyWrap').innerHTML = $('weeklyWrap').innerHTML = ''; return; }
  $('empty').hidden = true;

  const pattern = patterns.find((p) => p.id === currentPatternId) || patterns[0];
  $('patternSelect').value = pattern.id;
  const days = snapshot.data[pattern.id] || {};
  const dates = dateList(snapshot.startDate, snapshot.endDate);

  $('rangeMeta').textContent =
    `${snapshot.startDate} → ${snapshot.endDate} · updated ${new Date(snapshot.generatedAt).toLocaleString()}`;
  const ctrEvents = ctrEventsOf(days);
  $('eventsLine').innerHTML =
    `Tracked click events (auto-discovered cc_ai_*): ${ctrEvents.length ? ctrEvents.map((e) => `<code>${e}</code>`).join(' + ') : '<em>none tracked on these pages — CTRs fall back to</em> <code>all_button_clicks</code>'}` +
    (ctrEvents.length ? ' &nbsp;·&nbsp; trial-intent CTR counts only <code>cc_ai_free_trial</code> + AI-agent clicks (not <code>cc_ai_product_tour</code>)' : '') +
    ` &nbsp;·&nbsp; also tracked: <code>all_button_clicks</code>` +
    ` &nbsp;·&nbsp; Pattern: <code>${pattern.regex}</code>` +
    (pattern.excludeRegex ? ` minus <code>${pattern.excludeRegex}</code>` : '') +
    (pattern.example ? ` &nbsp;·&nbsp; <a class="patLink" href="${pattern.example}" target="_blank">example page ↗</a>` : '') +
    ' &nbsp;·&nbsp; Sessions exclude Direct traffic from China & Singapore' +
    (PAYLOAD.snapshot?.trials
      ? ` &nbsp;·&nbsp; <strong>Started Trials</strong>: Connect AI signups whose entry page matches this pattern, from the Salesforce lead field <code>Entry_Attribution__c</code>; <strong>CVR</strong> = trials ÷ engaged sessions per traffic type (trial channel from the Salesforce Source Category — Referral/AI Referral/unclassified count in All only; sessions from GA4, so per-channel CVRs are approximations${PAYLOAD.snapshot.trialsStart ? `; tracked since ${fmtShort(PAYLOAD.snapshot.trialsStart)}${PAYLOAD.snapshot.trialsStart.slice(0, 4)}, earlier days show “–”` : ''})` : '') +
    '';

  // CTR development chart above the tables (same chart as the timeline tab,
  // without evaluation blocks; traffic type from the dropdown)
  const chartExps = (PAYLOAD.experiments || []).filter((x) => x.url === pattern.id && x.implDate)
    .sort((a, b) => a.implDate.localeCompare(b.implDate));
  $('ctrChart').innerHTML = timelineChart(pattern, chartExps, dates, { bucket: ctrBucket, showEvals: false, showBands: false, compact: true, showTrials: true });

  // group consecutive dates into Mon–Sun weeks
  const weeks = [];
  for (const date of dates) {
    const last = weeks[weeks.length - 1];
    if (!last || parseDate(date).getUTCDay() === 1) weeks.push({ dates: [date] });
    else last.dates.push(date);
  }

  // (running-experiment day tint removed 2026-09-14 per Christof — the
  // evaluation-period tables below carry the experiment windows instead)
  const dailyCols = weeks.flatMap((w) =>
    w.dates.map((d, i) => ({ label: fmtDay(d), dates: [d], weekstart: i === 0, wknd: isWeekend(d) })));
  const weekHeader = weeks.map((w) => ({ label: weekLabel(w), span: w.dates.length }));
  $('dailyWrap').innerHTML = buildTable(pattern, days, dailyCols, weekHeader, true);

  const weeklyCols = weeks.map((w) => ({ label: weekLabel(w), dates: w.dates, weekstart: true }));
  $('weeklyWrap').innerHTML = buildTable(pattern, days, weeklyCols, null);

  renderRangeTables(pattern, days, weeks);

  $('dailyWrap').scrollLeft = $('dailyWrap').scrollWidth; // newest days in view (range cards follow via sync)
  $('weeklyWrap').scrollLeft = $('weeklyWrap').scrollWidth;
  // the Daily table is collapsed by default, so it has no width to scroll while
  // hidden — when it is opened, jump to the weekly table's current position
  $('dailyDetails').ontoggle = () => {
    if (!$('dailyDetails').open) return;
    const w = $('weeklyWrap'), d = $('dailyWrap');
    const wMax = w.scrollWidth - w.clientWidth;
    const frac = wMax > 0 ? w.scrollLeft / wMax : 1;
    d.scrollLeft = frac * (d.scrollWidth - d.clientWidth);
  };
}

// ---- custom date-range tables ---------------------------------------------
const customRanges = []; // [{start, end}] — re-rendered on every pattern switch

function renderRangeTables(pattern, days, weeks) {
  const wrap = $('rangeTables');
  wrap.innerHTML = '';
  const allDates = weeks.flatMap((w) => w.dates);
  const snapEnd = PAYLOAD.snapshot.endDate;

  // Experiment evaluation periods: one compact row per experiment with its
  // numbers aggregated over the evaluation window (the date-aligned daily
  // breakdown was removed 2026-09-16 per Christof). Titles jump to the
  // experiment's row on the Experimentation Log tab.
  const exps = (PAYLOAD.experiments || []).filter((x) => x.url === pattern.id && x.implDate)
    .sort((a, b) => a.implDate.localeCompare(b.implDate)); // chronological, newest on the right
  if (exps.length) {
    const tStart = PAYLOAD.snapshot?.trialsStart || '';
    const yr = (s) => `${fmtShort(s)}${s.slice(2, 4)}`;
    // full weekly-summary metric rows, one column per experiment period —
    // rendered by the same table builder as the daily/weekly tables
    const expCols = exps.map((x) => {
      const start = evalStart(x.implDate);
      const end = x.evalEnd || snapEnd;
      const dts = allDates.filter((d) => d >= start && d <= end);
      return {
        label: `<span class="expLink" data-exp="${(PAYLOAD.experiments || []).indexOf(x)}" title="Open on the Experimentation Log tab">${esc(x.title || '(untitled)')}</span>` +
          `<br><small style="font-weight:400">${yr(start)} – ${x.evalEnd ? yr(end) : 'running'} · ${dts.length}d</small>`,
        dates: dts,
        weekstart: true,
      };
    }).filter((c) => c.dates.length);
    if (expCols.length) {
      const card = document.createElement('section');
      card.className = 'rangeCard expSum';
      card.innerHTML =
        `<div class="rangeHead"><strong>Experiment evaluation periods</strong>` +
        `<span class="meta">aggregated over each window${tStart ? ` · trials tracked since ${yr(tStart)}` : ''}</span></div>` +
        `<div class="tableWrap">${buildTable(pattern, days, expCols, null)}</div>`;
      wrap.appendChild(card);
    }
  }

  customRanges.forEach((r, idx) => {
    const card = document.createElement('section');
    card.className = 'rangeCard aligned';
    card.innerHTML =
      `<div class="rangeHead"><strong>Date range: ${r.start} → ${r.end}</strong>` +
      `<button class="closeX" title="Remove this range" data-idx="${idx}">✕</button></div>` +
      `<div class="tableWrap">${buildRangeTable(pattern, days, weeks, [r])}</div>`;
    card.querySelector('.closeX').addEventListener('click', () => {
      customRanges.splice(idx, 1);
      render();
    });
    wrap.appendChild(card);
  });

  // keep the daily table, the weekly summary, and every aligned range card
  // horizontally in lockstep: proportional sync, so the weekly table (different
  // column widths) tracks the same time position as the day-grid panes
  for (const pane of [$('dailyWrap'), $('weeklyWrap'), ...wrap.querySelectorAll('.rangeCard.aligned .tableWrap')]) {
    bindScrollSync(pane);
  }
}

let scrollSyncing = false;
function bindScrollSync(pane) {
  if (pane._syncBound) return;
  pane._syncBound = true;
  pane.addEventListener('scroll', () => {
    if (scrollSyncing) return;
    scrollSyncing = true;
    const panes = [$('dailyWrap'), $('weeklyWrap'), ...$('rangeTables').querySelectorAll('.rangeCard.aligned .tableWrap')];
    const max = pane.scrollWidth - pane.clientWidth;
    const frac = max > 0 ? pane.scrollLeft / max : 0;
    for (const other of panes) {
      if (other === pane) continue;
      const omax = other.scrollWidth - other.clientWidth;
      if (omax > 0) other.scrollLeft = frac * omax;
    }
    requestAnimationFrame(() => { scrollSyncing = false; });
  });
}

$('addRangeBtn').addEventListener('click', () => {
  const s = PAYLOAD?.snapshot;
  if (!s) return;
  for (const el of [$('rangeStart'), $('rangeEnd')]) { el.min = s.startDate; el.max = s.endDate; }
  if (!$('rangeStart').value) $('rangeStart').value = s.startDate;
  if (!$('rangeEnd').value) $('rangeEnd').value = s.endDate;
  $('rangeForm').hidden = false;
  $('addRangeBtn').hidden = true;
});

$('rangeCancel').addEventListener('click', () => {
  $('rangeForm').hidden = true;
  $('addRangeBtn').hidden = false;
});

$('rangeApply').addEventListener('click', () => {
  let start = $('rangeStart').value, end = $('rangeEnd').value;
  if (!start || !end) return;
  if (start > end) [start, end] = [end, start];
  customRanges.push({ start, end });
  $('rangeForm').hidden = true;
  $('addRangeBtn').hidden = false;
  render();
});

// experiment titles in the timeline charts jump to the experiment's row on
// the Experimentation Log tab (clearing an active URL filter if it would
// hide the row), with a short highlight
function jumpToExperiment(idx) {
  const exp = (PAYLOAD.experiments || [])[idx];
  if (!exp) return;
  if (expUrlFilter && expUrlFilter !== exp.url) {
    expUrlFilter = '';
    renderExperiments();
  }
  document.querySelector('#topTabs button[data-view="exp"]').click();
  const cell = document.querySelector(`#expWrap .titleCell[data-i="${idx}"]`);
  if (!cell) return;
  const row = cell.closest('tr');
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });

// ---- web experiments --------------------------------------------------------
const CTR_TREND_HELP = `What this column tells you:

It shows how the trial-intent CTR developed under the experiment, compared against a fair "before" value. Counted as trial-intent clicks: cc_ai_free_trial plus every AI-agent click event on the page (e.g. cc_ai_claude_trial, cc_ai_chatgpt_app — the same set as the all_ai_agent_clicks row), since both contribute to the goal of starting trials. Not counted: cc_ai_product_tour — starting the product tour is not trial intent. Divided by engaged sessions of the chosen traffic type.

Why organic traffic by default? Organic visitors arrive on their own, so their clicking behavior reflects the page itself. Paid traffic changes whenever campaigns, budgets or targeting change — a CTR shift there could be caused by the campaign, not by the experiment.

Why sometimes paid? On pages with very little organic traffic, a handful of visitors would make the CTR jump around randomly and a trend would be meaningless. There we use paid traffic instead — on those pages it's the traffic that matters anyway. The label in the cell always tells you which one you're looking at. Organic clicks are always measured against organic sessions only, and paid clicks against paid sessions only — the two are never mixed.

What is it compared against? Ideally the previous experiment on the same page — its CTR over its own evaluation period. For the first experiment on a page, we instead take an equally long period from before the implementation, shifted back by whole weeks so it contains exactly the same weekdays (weekend CTR behaves very differently from weekdays, so the mix must match).

Pages without separate trial-intent click tracking (e.g. the /drivers/ MCP and Cloud pages) fall back to a CTR based on all button clicks (all_button_clicks). Wherever that applies, the chart subtitles and tooltips say so explicitly.

Some experiments track a secondary metric besides the trial-intent CTR (e.g. cc_ai_tool — clicks toward the /ai/connect/[datasource]-to-[LLM] combination pages). Those experiments show a second, smaller line in this column with the metric's own rate and click count. If the event tracking only started with the experiment, no baseline exists and the cell says so instead of showing a comparison.

Hover the value itself to see the exact comparison source and the min/max of the daily line.`;

const EXP_COLUMNS = ['Affected URL', 'Experiment', 'Original', 'Changes', 'Hypothesis', 'Ticket',
  'Implementation date', 'Evaluation period start', 'Evaluation period end',
  `CTR trend <span class="infoI" title="${CTR_TREND_HELP.replace(/"/g, '&quot;')}">i</span>`,
  'AI Evaluation', 'AI Test suggestions', ''];

// CTR trend: daily cc_ai_free_trial CTR over the evaluation period, on Organic
// traffic (least affected by campaigns). If organic volume is below a critical
// amount, fall back to Paid.
const SPARK_EVENT = 'cc_ai_free_trial';
// below ~50 organic sessions/day the per-event CTR is too noisy → use Paid
// (calibrated: /ai/ runs ~56-61 organic/day, ds-to-llm patterns ~35-40)
const MIN_ORGANIC_SESSIONS_PER_DAY = 50;

// clamp a date list to the days the snapshot actually covers
function snapDates(start, end) {
  const snap = PAYLOAD.snapshot;
  const s = start < snap.startDate ? snap.startDate : start;
  const e = end > snap.endDate ? snap.endDate : end;
  return s > e ? [] : dateList(s, e);
}

// trend metric: free-trial clicks plus every AI-agent click on the pattern —
// both contribute to the trial-start goal. Pages without any trial-intent
// event tracking (e.g. /drivers/[ds]/mcp|cloud/) fall back to all_button_clicks.
function trendMetricOf(days) {
  const names = Object.keys(discoveredEvents(days));
  const events = [...new Set([...(names.includes(SPARK_EVENT) ? [SPARK_EVENT] : []), ...agentEventsOf(days)])];
  if (events.length) return { events, fallback: false };
  return { events: ['all_button_clicks'], fallback: true };
}
const trendEventsOf = (days) => trendMetricOf(days).events;

const periodCtr = (days, dates, bucket, evNames) => {
  const s = sessSum(days, dates, bucket);
  return s ? (eventSum(days, dates, evNames, bucket) / s) * 100 : null;
};

// comparison CTR: the previous experiment on the same pattern, or — if none —
// a pre-period of the same length shifted back by whole weeks, so the weekday
// mix is identical (weekend CTR differs a lot from weekdays).
function baselineCtr(x, days, bucket, start, len, evNames) {
  const prev = (PAYLOAD.experiments || [])
    .filter((p) => p !== x && p.url === x.url && p.implDate && p.implDate < x.implDate)
    .sort((a, b) => b.implDate.localeCompare(a.implDate))[0];
  if (prev) {
    const pDates = snapDates(evalStart(prev.implDate), prev.evalEnd || PAYLOAD.snapshot.endDate);
    const ctr = pDates.length ? periodCtr(days, pDates, bucket, evNames) : null;
    if (ctr !== null) return { ctr, label: `previous experiment “${prev.title}”` };
  }
  const shift = 7 * Math.ceil(len / 7); // whole weeks back → same weekday mix, no overlap
  const bStart = iso(addDays(parseDate(start), -shift));
  const bEnd = iso(addDays(parseDate(start), -shift + len - 1));
  const bDates = snapDates(bStart, bEnd);
  if (!bDates.length) return { ctr: null, label: 'no baseline data' };
  return {
    ctr: periodCtr(days, bDates, bucket, evNames),
    label: `pre-period ${bDates[0]} → ${bDates[bDates.length - 1]} (weekday-aligned${bDates.length < len ? ', partial' : ''})`,
  };
}

function sparkline(x) {
  const snap = PAYLOAD.snapshot;
  const days = snap?.data?.[x.url];
  if (!days || !x.implDate) return '';
  const start = evalStart(x.implDate);
  const end = x.evalEnd || snap.endDate;
  const dates = snapDates(start, end);
  if (!dates.length) return '';
  const len = (parseDate(end) - parseDate(start)) / 86400000 + 1;

  const organicTotal = dates.reduce((a, d) => a + (days[d]?.s.organic ?? 0), 0);
  const bucket = organicTotal / dates.length >= MIN_ORGANIC_SESSIONS_PER_DAY ? 'organic' : 'paid';
  const bucketLabel = bucket === 'organic' ? 'Organic' : 'Paid';

  const metric = trendMetricOf(days);
  const evNames = metric.events;
  const expCtr = periodCtr(days, dates, bucket, evNames);
  if (expCtr === null) return '';
  const base = baselineCtr(x, days, bucket, start, len, evNames);
  const baseTxt = base.ctr === null ? 'n/a' : base.ctr.toFixed(1) + '%';
  const delta = base.ctr ? ` (${expCtr >= base.ctr ? '+' : ''}${(((expCtr - base.ctr) / base.ctr) * 100).toFixed(0)}%)` : '';

  // daily rate line within the evaluation period (shared by main + secondary)
  const dailyRates = (ev) => dates.map((d) => {
    const s = days[d]?.s[bucket] ?? 0;
    return s ? (eventSum(days, [d], ev, bucket) / s) * 100 : null;
  });
  const miniLine = (vals, height = 26) => {
    const nums = vals.filter((v) => v !== null);
    if (nums.length < 2) return '';
    const min = Math.min(...nums), max = Math.max(...nums), span = (max - min) || 1;
    const W = 110, H = height, P = 2;
    const pts = vals
      .map((v, i) => v === null ? null :
        `${(P + (i * (W - 2 * P)) / (dates.length - 1)).toFixed(1)},${(H - P - ((v - min) * (H - 2 * P)) / span).toFixed(1)}`)
      .filter(Boolean);
    return `<svg width="${W}" height="${H}"><polyline points="${pts.join(' ')}" fill="none" stroke="#002660" stroke-width="1.3"/></svg>`;
  };
  const svg = miniLine(dailyRates(evNames));

  const main = `<span title="${metric.fallback ? 'Button-click CTR (no trial-intent tracking on these pages)' : 'Trial-intent CTR'} (${evNames.join(' + ')}), ${bucketLabel} traffic. Baseline (${base.label}): ${baseTxt}. ` +
    `Evaluation period aggregate: ${expCtr.toFixed(1)}%. Line = daily CTR within the evaluation period.">` +
    `${svg}<small>${bucketLabel}: ${baseTxt} → ${expCtr.toFixed(1)}%${delta}</small></span>`;

  // optional secondary metric declared on the experiment (e.g. cc_ai_tool =
  // clicks toward the X+Y combination pages): its own smaller line + numbers.
  // A baseline only exists if the events fired before the window at all —
  // freshly instrumented events get an explicit no-baseline note instead.
  let secondary = '';
  if (Array.isArray(x.secondaryEvents) && x.secondaryEvents.length) {
    const ev2 = x.secondaryEvents;
    const label2 = x.secondaryLabel || ev2.join(' + ');
    const rate2 = periodCtr(days, dates, bucket, ev2);
    const clicks2 = eventSum(days, dates, ev2, bucket);
    const trackedBefore = Object.keys(days).some((d) => d < start && ev2.some((n) => (days[d].e[n]?.all ?? 0) > 0));
    const base2 = trackedBefore ? baselineCtr(x, days, bucket, start, len, ev2) : { ctr: null, label: '' };
    const base2Txt = base2.ctr === null ? '—' : base2.ctr.toFixed(1) + '%';
    secondary = `<br><span title="Secondary metric “${esc(label2)}” (${ev2.join(' + ')}), ${bucketLabel} traffic. ` +
      `${trackedBefore ? `Baseline (${base2.label}): ${base2Txt}.` : 'No baseline — this event tracking started with the experiment.'} ` +
      `Evaluation period: ${fmtInt(clicks2)} clicks, ${rate2 === null ? 'n/a' : rate2.toFixed(1) + '%'} of ${bucketLabel.toLowerCase()} sessions. Line = daily rate.">` +
      `${miniLine(dailyRates(ev2), 16)}<small><em>${esc(label2)}: ${base2Txt} → ${rate2 === null ? 'n/a' : rate2.toFixed(1) + '%'} (${fmtInt(clicks2)} clicks)</em></small></span>`;
  }
  return main + secondary;
}

const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const evalStart = (implDate) => implDate ? iso(addDays(parseDate(implDate), 1)) : '';

// auto-generate a short (≤3 words) title from the changes/hypothesis text;
// used whenever the title field is left empty. Manual rename always wins.
const TITLE_STOPWORDS = new Set(('the a an of to too and or for with in on by is are was be being shall should we our their this that ' +
  'it its as at from into up down over under more most less new old previous version page pages again only ' +
  'each one all any some h2 h3 cta ctas ctr').split(' '));
function autoTitle(exp) {
  const src = (exp.experiment || exp.hypothesis || '').replace(/[^\p{L}\p{N}\s-]/gu, ' ');
  const words = src.split(/\s+/).filter((w) => w.length > 2 && !TITLE_STOPWORDS.has(w.toLowerCase()));
  if (!words.length) return 'Experiment ' + (exp.implDate || '');
  return words.slice(0, 3).map((w) => w[0].toUpperCase() + w.slice(1)).join(' ').slice(0, 40);
}

let expUrlFilter = ''; // '' = show all

function renderExperiments() {
  const exps = PAYLOAD.experiments || [];
  const readOnly = !!window.__EMBEDDED__;
  // filter dropdown in the Affected URL header: only URLs present in the column
  const usedUrls = [...new Set(exps.map((x) => x.url))];
  const urlFilterHtml = `<br><select id="expUrlFilterSel"><option value="">(all)</option>` +
    usedUrls.map((u) => {
      const label = PAYLOAD.patterns.find((p) => p.id === u)?.label ?? u;
      return `<option value="${esc(u)}"${u === expUrlFilter ? ' selected' : ''}>${esc(label)}</option>`;
    }).join('') + '</select>';
  // proportional widths: prose columns get the space, dates/ticket stay narrow
  const widths = ['8.5%', '6.5%', '11%', '12.5%', '13%', '4%', '5.5%', '5.5%', '5.5%', '6%', '11%', '9.5%', '1.5%'];
  let html = '<table><colgroup>' + widths.map((w) => `<col style="width:${w}">`).join('') + '</colgroup>' +
    '<thead><tr>' + EXP_COLUMNS.map((c, i) => `<th>${c}${i === 0 ? urlFilterHtml : ''}</th>`).join('') + '</tr></thead><tbody>';
  const clamp = (s) => `<span class="cellText" title="Click to expand/collapse">${esc(s)}</span>`;
  // Original/Changes cells can carry a screenshot (stored as a data URI, so the
  // standalone artifact keeps it too). Attach: copy an image → 📋 button.
  const IMG_FIELD = { original: 'originalImg', experiment: 'changesImg' };
  const proseCell = (x, i, field, ro) => {
    const f = IMG_FIELD[field];
    let h = '';
    if (x[f]) {
      h += `<div class="imgWrap"><img class="cellImg" src="${x[f]}">` +
        (ro ? '' : `<button class="imgDel" data-i="${i}" data-f="${f}" title="Remove image">✕</button>`) + '</div>';
    }
    h += clamp(x[field]);
    if (!x[f] && !ro) h += `<button class="imgAdd" data-i="${i}" data-f="${f}" title="Copy an image to the clipboard first, then click here to attach it">📋 add image</button>`;
    return h;
  };
  // evaluation/suggestion cells: AI-written text + an update-request button.
  // Clicking flags the experiment; the next Claude run (Monday refresh or an
  // interactive session) re-analyzes it against fresh CTR data + live pages.
  const evalCell = (x, i, field, ro) => {
    const badge = x.evalUpdateRequested
      ? '<div class="updPending">⟳ update requested — refreshed on the next Claude run</div>' : '';
    const btn = ro || x.evalUpdateRequested ? '' :
      `<button class="updBtn" data-i="${i}" title="Request a fresh AI evaluation based on current data">⟳ update</button>`;
    return `${badge}${clamp(x[field])}${btn}`;
  };
  // newest experiments first; data-i keeps the original index for edit/delete
  const ordered = exps.map((x, i) => [x, i])
    .filter(([x]) => !expUrlFilter || x.url === expUrlFilter)
    .sort(([a], [b]) => (b.implDate || '').localeCompare(a.implDate || ''));
  for (const [x, i] of ordered) {
    const ticket = /^https?:\/\//.test(x.ticket || '')
      ? `<a href="${esc(x.ticket)}" target="_blank">${/asana\.com/.test(x.ticket) ? 'Asana' : esc(x.ticket.split('/')[2] || x.ticket)}</a>`
      : esc(x.ticket);
    const pat = PAYLOAD.patterns.find((p) => p.id === x.url);
    const urlLabel = pat?.label ?? x.url;
    const urlCell = pat?.example
      ? `<a class="patLink" href="${pat.example}" target="_blank" title="Open an example page: ${pat.example}"><code>${esc(urlLabel)}</code> ↗</a>`
      : `<code>${esc(urlLabel)}</code>`;
    html += `<tr><td>${urlCell}</td>` +
      `<td><strong class="titleCell" data-i="${i}" title="Click to rename">${esc(x.title)}</strong></td>` +
      `<td>${proseCell(x, i, 'original', readOnly)}</td><td>${proseCell(x, i, 'experiment', readOnly)}</td>` +
      `<td>${clamp(x.hypothesis)}</td><td>${ticket}</td>` +
      `<td>${readOnly ? esc(x.implDate) : `<span class="dateCell" data-i="${i}" data-f="implDate" title="Click to change">${esc(x.implDate)}</span>`}</td>` +
      `<td>${evalStart(x.implDate)}</td>` +
      `<td>${readOnly ? (esc(x.evalEnd) || '<em>running</em>') : `<span class="dateCell" data-i="${i}" data-f="evalEnd" title="Click to change (empty = running)">${esc(x.evalEnd) || '<em>running</em>'}</span>`}</td>` +
      `<td>${sparkline(x)}</td>` +
      `<td>${evalCell(x, i, 'evaluation', readOnly)}</td><td>${evalCell(x, i, 'suggestions', readOnly)}</td>` +
      `<td>${readOnly ? '' : `<button class="delX" data-i="${i}" title="Remove">✕</button>`}</td></tr>`;
  }
  if (!readOnly) {
    // empty row: click any cell to add a new experiment inline
    html += `<tr class="newRow"><td>+ add experiment…</td>${'<td></td>'.repeat(EXP_COLUMNS.length - 1)}</tr>`;
  }
  html += '</tbody></table>';
  $('expWrap').innerHTML = html;
  for (const btn of $('expWrap').querySelectorAll('.delX')) {
    btn.addEventListener('click', async () => {
      PAYLOAD.experiments.splice(Number(btn.dataset.i), 1);
      await saveExperiments();
      renderExperiments();
      render(); // evaluation-period tables on the CTR tab depend on experiments
      renderTimelines();
    });
  }
  $('expWrap').querySelector('tr.newRow')?.addEventListener('click', showNewExpEditor, { once: true });
  $('expUrlFilterSel').addEventListener('change', (e) => {
    expUrlFilter = e.target.value;
    renderExperiments();
  });
  for (const cell of $('expWrap').querySelectorAll('.cellText')) {
    cell.addEventListener('click', () => cell.closest('tr').classList.toggle('expanded'));
  }
  for (const btn of $('expWrap').querySelectorAll('.imgAdd')) {
    btn.addEventListener('click', async () => {
      try {
        const items = await navigator.clipboard.read();
        for (const item of items) {
          const type = item.types.find((t) => t.startsWith('image/'));
          if (!type) continue;
          const blob = await item.getType(type);
          const dataUri = await new Promise((res) => {
            const fr = new FileReader();
            fr.onload = () => res(fr.result);
            fr.readAsDataURL(blob);
          });
          PAYLOAD.experiments[Number(btn.dataset.i)][btn.dataset.f] = dataUri;
          await saveExperiments();
          renderExperiments();
          return;
        }
        alert('No image found in the clipboard — copy an image first, then click the button again.');
      } catch (e) {
        alert('Could not read the clipboard: ' + e.message);
      }
    });
  }
  for (const btn of $('expWrap').querySelectorAll('.imgDel')) {
    btn.addEventListener('click', async () => {
      delete PAYLOAD.experiments[Number(btn.dataset.i)][btn.dataset.f];
      await saveExperiments();
      renderExperiments();
    });
  }
  for (const btn of $('expWrap').querySelectorAll('.updBtn')) {
    btn.addEventListener('click', async () => {
      PAYLOAD.experiments[Number(btn.dataset.i)].evalUpdateRequested = true;
      await saveExperiments();
      renderExperiments();
    });
  }
  // click a date to change it (implementation date or evaluation end;
  // clearing the end date sets the experiment back to "running")
  if (!readOnly) {
    for (const el of $('expWrap').querySelectorAll('.dateCell')) {
      el.addEventListener('click', () => {
        const i = Number(el.dataset.i), f = el.dataset.f;
        const exp = PAYLOAD.experiments[i];
        const td = el.parentElement;
        td.innerHTML = `<input type="date" value="${esc(exp[f] || '')}">`;
        const inp = td.querySelector('input');
        inp.focus();
        inp.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') inp.blur();
          if (e.key === 'Escape') { inp.value = exp[f] || ''; inp.blur(); }
        });
        inp.addEventListener('blur', async () => {
          if (f === 'implDate' && !inp.value) { renderExperiments(); return; } // implementation date is required
          exp[f] = inp.value;
          await saveExperiments();
          renderExperiments();
          render();          // evaluation periods + running-window tint move with the dates
          renderTimelines(); // timeline bands too
        });
      });
    }
  }
  // click a title to rename it (empty input → regenerate automatically)
  if (!readOnly) {
    for (const el of $('expWrap').querySelectorAll('.titleCell')) {
      el.addEventListener('click', () => {
        const i = Number(el.dataset.i);
        const exp = PAYLOAD.experiments[i];
        const td = el.parentElement;
        td.innerHTML = `<input value="${esc(exp.title || '')}">`;
        const inp = td.querySelector('input');
        inp.focus();
        inp.select();
        inp.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') inp.blur();
          if (e.key === 'Escape') { inp.value = exp.title || ''; inp.blur(); }
        });
        inp.addEventListener('blur', async () => {
          exp.title = inp.value.trim() || autoTitle(exp);
          await saveExperiments();
          renderExperiments();
          render(); // baseline tooltips on the CTR tab reference titles
        });
      });
    }
  }
}

    `<td></td><td></td><td></td>` +

      hypothesis: $('neHypothesis').value.trim(),
